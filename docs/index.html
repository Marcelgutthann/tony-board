<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Tony Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#060c18; --bg2:#0c1830;
  --glas:rgba(255,255,255,.055); --glas-stark:rgba(255,255,255,.09);
  --kante:rgba(255,255,255,.14); --kante-hell:rgba(255,255,255,.3);
  --text:#f1f0f8; --text2:rgba(241,240,248,.72); --text3:rgba(241,240,248,.55);
  --gruen:#7fe0b0; --gelb:#f3d27a; --violett:#7fb2ff; --blau:#8fb8ff;
}
/* Alles skaliert mit der Bildschirmbreite: 16 px am Laptop, bis 30 px auf 4K */
html{font-size:clamp(15px, .6vw + 8px, 32px)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:Inter,system-ui,sans-serif;color:var(--text);line-height:1.5;
  background:
    radial-gradient(70vw 45vw at 50% 55%, rgba(56,120,255,.16), transparent 60%),
    radial-gradient(50vw 30vw at 85% 8%, rgba(60,200,255,.07), transparent 60%),
    linear-gradient(180deg,var(--bg2),var(--bg));
  overflow:hidden;-webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:var(--blau);text-decoration:none}a:hover{text-decoration:underline}

/* Kopf */
.kopf{position:fixed;inset:0 0 auto 0;height:4.4rem;display:flex;align-items:center;justify-content:space-between;padding:0 1.6rem;z-index:20}
.marke{display:flex;align-items:center;gap:.7rem;font-weight:600;font-size:1.15rem;letter-spacing:-.01em}
.marke .punkt{width:2.2rem;height:2.2rem;border-radius:.7rem;display:grid;place-items:center;background:var(--glas-stark);border:1px solid var(--kante)}
.marke .punkt svg{width:1.15rem;height:1.15rem}
.marke span.leise{color:var(--text3);font-weight:500}
.live{display:flex;align-items:center;gap:.5rem;font-size:.8rem;color:var(--text2)}
.live i{width:.45rem;height:.45rem;border-radius:50%;background:var(--gruen)}
.live.aus i{background:#ff7a7a}
.umschalter{display:flex;gap:.25rem;padding:.25rem;border-radius:999px;background:rgba(255,255,255,.04);border:1px solid var(--kante)}
.umschalter button{padding:.5rem 1.05rem;border-radius:999px;font-size:.85rem;color:var(--text2);display:flex;gap:.45rem;align-items:center}
.umschalter button svg{width:.95rem;height:.95rem}
.umschalter button.an{background:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,.06));color:var(--text);box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 .3rem .9rem rgba(0,0,0,.35)}
.umschalter .zahl{font-size:.7rem;min-width:1.1rem;padding:0 .3rem;border-radius:999px;background:rgba(127,178,255,.25);color:var(--text)}

/* To-dos */
.todos{position:fixed;left:1.6rem;top:5.4rem;width:17rem;z-index:15;padding:1rem 1rem .8rem;border-radius:1.1rem;
  background:rgba(10,20,40,.92);border:1px solid var(--kante)}
.todos h3{font-size:.78rem;font-weight:600;color:var(--text2);letter-spacing:.02em;margin-bottom:.6rem}
.todos ul{list-style:none;display:flex;flex-direction:column;gap:.5rem}
.todos li{display:flex;gap:.6rem;font-size:.88rem;line-height:1.35}
.todos li .box{flex:none;width:.95rem;height:.95rem;margin-top:.1rem;border-radius:.3rem;border:1px solid var(--kante-hell)}
.todos li.erl{color:var(--text3);text-decoration:line-through}
.todos li.erl .box{background:var(--gruen);border-color:var(--gruen)}
.todos .leer{font-size:.8rem;color:var(--text3)}

/* Bühne */
.buehne{position:fixed;inset:4.4rem 0 8.6rem 0}
.rondell{position:absolute;inset:0;perspective:120rem}
.fenster{
  position:absolute;left:50%;top:50%;
  width:min(62vw, 100rem);height:min(calc(100% - 2.5rem), 58rem);
  border-radius:1.4rem;
  background:linear-gradient(160deg,rgba(38,58,96,.96),rgba(16,28,52,.97) 45%,rgba(20,34,62,.97));
  border:1px solid var(--kante);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 2rem 5rem rgba(0,0,0,.5);
  display:flex;flex-direction:column;overflow:hidden;
  transition:transform .55s cubic-bezier(.22,.9,.24,1),opacity .55s;
  will-change:transform,opacity;backface-visibility:hidden;cursor:pointer;
}
.fenster.vorn{cursor:default;border-color:var(--kante-hell)}
.fenster.braucht{border-color:rgba(243,210,122,.55)}
.f-kopf{display:flex;align-items:center;gap:1rem;padding:1.2rem 1.5rem 1rem;border-bottom:1px solid rgba(255,255,255,.08)}
.logo{flex:none;width:2.9rem;height:2.9rem;border-radius:.85rem;display:grid;place-items:center;background:rgba(255,255,255,.94);box-shadow:0 .3rem .9rem rgba(0,0,0,.3)}
.logo svg{width:1.75rem;height:1.75rem}
.logo img{width:2.3rem;height:2.3rem;object-fit:contain}
.akarte .logo img{width:1.85rem;height:1.85rem}
.f-titel{flex:1;min-width:0}
.f-titel small{display:block;font-size:.75rem;color:var(--text3);text-transform:capitalize;margin-bottom:.1rem}
.f-titel b{display:block;font-size:1.3rem;font-weight:600;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status{font-size:.8rem;color:var(--text2);display:flex;align-items:center;gap:.4rem;white-space:nowrap;padding:.35rem .8rem;border-radius:999px;border:1px solid var(--kante)}
.status i{width:.45rem;height:.45rem;border-radius:50%;background:var(--violett)}
.status.braucht_dich{border-color:rgba(243,210,122,.5);color:var(--text)}.status.braucht_dich i{background:var(--gelb)}
.status.fertig i{background:var(--gruen)}
.status.wartet i{background:none;border:1px dashed var(--text3)}
/* Aktivitaet: nur "arbeitet" bewegt sich; wartet ruhig, fertig statisch */
.status.arbeitet i{animation:puls 1.6s ease-in-out infinite}
@keyframes puls{0%,100%{box-shadow:0 0 0 0 rgba(127,178,255,.6)}50%{box-shadow:0 0 0 .3rem rgba(127,178,255,0)}}
.f-titel small.frisch{display:block;font-size:.7rem;color:var(--text3);margin-top:.15rem;text-transform:none}
.f-titel small.frisch.alt{color:var(--gelb)}
.lage .stand .laeuft{display:inline-flex;gap:.18rem;margin-left:.45rem;vertical-align:middle}
.lage .stand .laeuft i{width:.3rem;height:.3rem;border-radius:50%;background:var(--violett);animation:tupf 1.2s ease-in-out infinite}
.lage .stand .laeuft i:nth-child(2){animation-delay:.2s}.lage .stand .laeuft i:nth-child(3){animation-delay:.4s}
@keyframes tupf{0%,80%,100%{opacity:.25}40%{opacity:1}}
.fenster.arbeitet .schritt.akt .k{border-color:var(--violett) transparent var(--violett) var(--violett);background:none;animation:dreh 1s linear infinite}
@keyframes dreh{to{transform:rotate(360deg)}}
.fenster.still .status i,.fenster.still .schritt.akt .k,.fenster.still .laeuft{animation:none}
.fenster.still .laeuft{display:none}
@media (prefers-reduced-motion:reduce){
  .status.arbeitet i,.laeuft i,.fenster.arbeitet .schritt.akt .k{animation:none}
  .fenster.arbeitet .schritt.akt .k{border-color:var(--violett);background:rgba(127,178,255,.45)}
}

/* Lage wie Claudes Antwortkopf: Auftrag, Stand, Von dir */
.lage{padding:1rem 1.5rem 1.1rem;border-bottom:1px solid rgba(255,255,255,.08);display:flex;flex-direction:column;gap:.55rem}
.lage .z{display:grid;grid-template-columns:5.2rem 1fr;gap:1rem;align-items:baseline}
.lage .z span{font-size:.75rem;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--text3)}
.lage .z p{font-size:1rem;color:var(--text2);line-height:1.4}
.lage .z b{color:var(--text);font-weight:700}
.lage .stand p{font-size:1.65rem;line-height:1.28;font-weight:500;letter-spacing:-.015em;color:var(--text2)}
.lage .vondir{margin-top:.2rem;padding:.65rem .9rem;border-radius:.8rem;background:rgba(243,210,122,.1);border:1px solid rgba(243,210,122,.35);grid-template-columns:4.2rem 1fr}
.lage .vondir span{color:var(--gelb)}
.lage .vondir p{color:var(--text);font-size:1.08rem;font-weight:500}
.f-koerper{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain}
.f-spalte{padding:1.2rem 1.5rem}
.f-koerper::-webkit-scrollbar{width:.4rem}.f-koerper::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:.4rem}
.widgets{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,24rem),1fr));gap:1rem;align-items:start}
.widgets .w.breit{grid-column:1/-1}
details.mehr-text{margin-top:1.1rem;border-top:1px solid rgba(255,255,255,.08);padding-top:.9rem}
details.mehr-text summary{cursor:pointer;color:var(--text2);font-size:.9rem;list-style:none;display:flex;align-items:center;gap:.5rem}
details.mehr-text summary::before{content:"\203A";display:inline-block;transition:transform .2s;font-size:1.1rem}
details.mehr-text[open] summary::before{transform:rotate(90deg)}
details.mehr-text > div{margin-top:.8rem}
.leise-knopf{font-size:.85rem;color:var(--text2);padding:.45rem .9rem;border-radius:999px;border:1px solid var(--kante)}
.leise-knopf:hover{color:var(--text);border-color:var(--kante-hell)}
.archiv{position:absolute;inset:0;display:none;justify-content:center;overflow:auto;padding:0 1.6rem 1.2rem}
.archiv.an{display:flex}
.archiv .spalte{width:min(100%,70rem);display:flex;flex-direction:column;gap:.8rem;padding-top:.5rem}
.archiv h2{font-size:1.35rem;font-weight:600}
.archiv input{padding:.8rem 1.1rem;border-radius:.9rem;background:var(--glas);border:1px solid var(--kante);color:var(--text);font:inherit;font-size:1rem;outline:0}
.archiv .liste{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,30rem),1fr));gap:.8rem}
.akarte{display:flex;gap:.9rem;align-items:flex-start;text-align:left;padding:1rem 1.1rem;border-radius:1rem;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09)}
.akarte:hover{background:rgba(255,255,255,.09)}
.akarte .logo{width:2.3rem;height:2.3rem;border-radius:.7rem}.akarte .logo svg{width:1.4rem;height:1.4rem}
.akarte b{display:block;font-size:1.02rem}
.akarte span{display:block;font-size:.92rem;color:var(--text2);margin-top:.15rem}
.akarte small{display:block;font-size:.78rem;color:var(--text3);margin-top:.3rem}
.f-spalte::-webkit-scrollbar{width:.4rem}.f-spalte::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:.4rem}
.f-meta{display:grid;grid-template-columns:auto 1fr;gap:.3rem 1.2rem;font-size:.95rem;margin-bottom:1rem;padding-bottom:1rem;border-bottom:1px solid rgba(255,255,255,.07)}
.f-meta dt{color:var(--text3)}
.f-meta dd{color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.f-inhalt{font-size:1.08rem;line-height:1.65;color:var(--text)}
.f-inhalt p{margin:0 0 .85em}
.f-inhalt h3{font-size:1.15rem;font-weight:600;margin:1em 0 .45em;letter-spacing:-.01em}
.f-inhalt h3:first-child{margin-top:0}
.f-inhalt ul,.f-inhalt ol{margin:0 0 .9em 1.3em}
.f-inhalt li{margin:.2em 0}
.f-inhalt blockquote{border-left:3px solid var(--violett);padding:.2em 0 .2em 1em;color:var(--text2);margin:0 0 .9em}
.f-inhalt code{font-family:"JetBrains Mono",monospace;font-size:.88em;background:rgba(255,255,255,.08);padding:.1em .35em;border-radius:.3em}
.f-inhalt.code{font-family:"JetBrains Mono",monospace;font-size:.92rem;white-space:pre-wrap}

/* Chatverlauf */
.verlauf{display:flex;flex-direction:column;gap:.7rem;margin-bottom:1.2rem}
.blase{max-width:82%;padding:.75rem 1rem;border-radius:1.1rem 1.1rem 1.1rem .3rem;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.08);font-size:1rem;line-height:1.5}
.blase.eigen{align-self:flex-end;border-radius:1.1rem 1.1rem .3rem 1.1rem;background:rgba(127,178,255,.2);border-color:rgba(127,178,255,.3)}
.blase .wer{display:flex;justify-content:space-between;gap:1rem;font-size:.75rem;color:var(--text3);margin-bottom:.2rem}
.blase .wer b{color:var(--text2);font-weight:600}
.blase p{margin:0 0 .5em}.blase p:last-child{margin:0}

/* Widgets */
.w{border-radius:1rem;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09);padding:1rem 1.1rem}
.w h4{font-size:.78rem;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:.7rem}
.w-kennzahlen{display:grid;grid-template-columns:repeat(auto-fit,minmax(9rem,1fr));gap:.7rem}
.w-zahl{padding:.8rem .9rem;border-radius:.8rem;background:rgba(255,255,255,.05)}
.w-zahl b{display:block;font-size:1.75rem;font-weight:600;letter-spacing:-.02em;line-height:1.15}
.w-zahl span{display:block;font-size:.82rem;color:var(--text2);margin-top:.15rem}
.w-zahl small{display:block;font-size:.75rem;color:var(--text3);margin-top:.15rem}
.w table{width:100%;border-collapse:collapse;font-size:.92rem}
.w th{text-align:left;font-weight:600;color:var(--text2);padding:.45rem .6rem;border-bottom:1px solid var(--kante)}
.w td{padding:.5rem .6rem;border-bottom:1px solid rgba(255,255,255,.06);vertical-align:top}
.w tr:last-child td{border-bottom:0}
.w-check{list-style:none;display:flex;flex-direction:column;gap:.5rem;font-size:.98rem}
.w-check li{display:flex;gap:.6rem}
.w-check .k{flex:none;width:1.1rem;height:1.1rem;margin-top:.15rem;border-radius:.35rem;border:1px solid var(--kante-hell);display:grid;place-items:center;font-size:.7rem}
.w-check li.erl .k{background:rgba(127,224,176,.25);border-color:var(--gruen);color:var(--gruen)}
.w-check li.erl{color:var(--text2)}
.w-vergleich{display:grid;grid-template-columns:1fr 1fr;gap:.7rem}
.w-vergleich > div{padding:.8rem .9rem;border-radius:.8rem;background:rgba(255,255,255,.05)}
.w-vergleich b{display:block;font-size:1rem;margin-bottom:.4rem}
.w-vergleich ul{margin-left:1.1em;font-size:.92rem;color:var(--text2)}
.w-balken{display:flex;flex-direction:column;gap:.55rem;font-size:.9rem}
.w-balken .z{display:grid;grid-template-columns:minmax(6rem,30%) 1fr auto;gap:.7rem;align-items:center}
.w-balken .spur{height:.6rem;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden}
.w-balken .spur i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#3d7bff,#7fb2ff)}
.w-balken .z span:last-child{color:var(--text2);font-variant-numeric:tabular-nums}
.w-links{display:flex;flex-direction:column;gap:.55rem}
.w-links a{display:block;padding:.7rem .9rem;border-radius:.8rem;background:rgba(255,255,255,.05);color:var(--text)}
.w-links a:hover{background:rgba(255,255,255,.09);text-decoration:none}
.w-links b{display:block;font-size:.98rem;font-weight:600}
.w-links small{display:block;font-size:.8rem;color:var(--text3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.w-links span{display:block;font-size:.88rem;color:var(--text2);margin-top:.15rem}
.w-zitat{font-size:1.15rem;line-height:1.5}
.w-zitat small{display:block;font-size:.82rem;color:var(--text3);margin-top:.5rem}
.w img{display:block;max-width:100%;border-radius:.7rem}
.w iframe{display:block;width:100%;height:22rem;border:0;border-radius:.7rem;background:#fff}

.f-fuss{padding:.9rem 1.5rem 1rem;border-top:1px solid rgba(255,255,255,.08);display:flex;flex-wrap:wrap;gap:.5rem 1.1rem;align-items:center}
.schritt{font-size:.85rem;color:var(--text3);display:flex;align-items:center;gap:.4rem}
.schritt .k{width:1rem;height:1rem;border-radius:50%;border:1px solid var(--kante-hell);display:grid;place-items:center;font-size:.6rem}
.schritt.erl{color:var(--text2)}.schritt.erl .k{background:rgba(127,224,176,.2);border-color:var(--gruen);color:var(--gruen)}
.schritt.akt{color:var(--text)}.schritt.akt .k{border-color:var(--violett);background:rgba(127,178,255,.25)}
.freigabe{display:flex;gap:.5rem;margin-left:auto}
.glasknopf{padding:.55rem 1.1rem;border-radius:999px;font-size:.9rem;font-weight:500;
  background:linear-gradient(180deg,rgba(255,255,255,.18),rgba(255,255,255,.05));border:1px solid var(--kante-hell);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 .4rem 1.1rem rgba(0,0,0,.35)}
.glasknopf.ja{background:linear-gradient(180deg,rgba(127,224,176,.35),rgba(127,224,176,.12));border-color:rgba(127,224,176,.6)}
.marke-frei{font-size:.85rem;color:var(--gruen);margin-left:auto}
.marke-ab{font-size:.85rem;color:#ff9b9b;margin-left:auto}

/* Mehrfenster: alle Sitzungen links, Inhalt der gewaehlten rechts */
.mehr{position:absolute;inset:0;display:none;grid-template-columns:minmax(17rem,23rem) 1fr;gap:1.2rem;padding:0 1.6rem 1.2rem}
.mehr.an{display:grid}
body.v-mehrfenster .todos{display:none}
.leiste{display:flex;flex-direction:column;min-height:0;border-radius:1.2rem;background:rgba(10,20,40,.78);border:1px solid var(--kante);overflow:hidden}
.leiste-kopf{padding:.9rem 1rem .7rem;border-bottom:1px solid rgba(255,255,255,.08)}
.leiste-kopf b{display:block;font-size:.95rem;font-weight:600}
.leiste-kopf span{display:block;font-size:.78rem;color:var(--text3);margin-top:.1rem}
.leiste-liste{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;padding:.4rem .5rem .6rem}
.leiste-liste::-webkit-scrollbar{width:.4rem}.leiste-liste::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:.4rem}
.gruppe{font-size:.68rem;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--text3);padding:.7rem .5rem .3rem}
.gruppe.braucht_dich{color:var(--gelb)}
.sitzung{width:100%;display:grid;grid-template-columns:auto 1fr;gap:.7rem;align-items:start;text-align:left;padding:.65rem .6rem;border-radius:.9rem;border:1px solid transparent;margin-bottom:.15rem;touch-action:manipulation}
.sitzung .logo{width:2.3rem;height:2.3rem;border-radius:.7rem}.sitzung .logo svg{width:1.4rem;height:1.4rem}.sitzung .logo img{width:1.85rem;height:1.85rem}
.sitzung .s-text{min-width:0}
.sitzung b{display:block;font-size:.95rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sitzung .s-zeile{display:flex;align-items:center;gap:.45rem;margin-top:.15rem;font-size:.74rem;color:var(--text3);white-space:nowrap}
.sitzung .s-zeile .status{padding:.1rem .5rem;font-size:.72rem}
.sitzung .s-zeile .frisch{overflow:hidden;text-overflow:ellipsis}
.sitzung .frisch.alt{color:var(--gelb)}
.sitzung .s-stand{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:.84rem;line-height:1.35;color:var(--text2);margin-top:.3rem}
.sitzung .s-stand.vondir{color:var(--gelb)}
.sitzung .tony{display:inline-block;font-size:.66rem;font-weight:600;padding:.05rem .45rem;border-radius:999px;background:rgba(127,178,255,.22);color:var(--text);margin-left:.35rem;vertical-align:.1rem}
.sitzung{transition:background-color .18s ease}
.sitzung .logo{transition:transform .18s ease}
.sitzung:hover{background:rgba(255,255,255,.06)}
.sitzung:hover .logo{transform:scale(1.22)}
.detail .fenster.neu{animation:einblenden .22s ease}
@keyframes einblenden{from{opacity:.35}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.sitzung,.sitzung .logo{transition:none}.sitzung:hover .logo{transform:none}.detail .fenster.neu{animation:none}}
.sitzung.gewaehlt{background:rgba(127,178,255,.14);border-color:rgba(127,178,255,.4)}
.sitzung.braucht_dich{box-shadow:inset .2rem 0 0 var(--gelb)}
.sitzung.still .status i{animation:none}
.sitzung:focus-visible{outline:2px solid var(--blau);outline-offset:1px}
.leiste-todos{border-top:1px solid rgba(255,255,255,.08);padding:.6rem 1rem .8rem;max-height:30%;overflow:auto}
.leiste-todos summary{cursor:pointer;font-size:.78rem;font-weight:600;color:var(--text2);list-style:none}
.leiste-todos ul{list-style:none;display:flex;flex-direction:column;gap:.4rem;margin-top:.5rem}
.leiste-todos li{display:flex;gap:.5rem;font-size:.84rem;line-height:1.35}
.leiste-todos li .box{flex:none;width:.9rem;height:.9rem;margin-top:.12rem;border-radius:.3rem;border:1px solid var(--kante-hell)}
.leiste-todos li.erl{color:var(--text3);text-decoration:line-through}
.leiste-todos li.erl .box{background:var(--gruen);border-color:var(--gruen)}
.detail{min-width:0;min-height:0;display:flex;flex-direction:column;gap:.6rem}
.detail .fenster{position:relative;left:auto;top:auto;width:auto;height:auto;flex:1;min-height:0;transform:none;cursor:default;transition:none}
.detail .lage .stand p{font-size:1.4rem}
.band{display:flex;align-items:center;gap:.8rem;padding:.55rem .6rem .55rem 1rem;border-radius:.9rem;font-size:.88rem;color:var(--text2);background:rgba(127,178,255,.1);border:1px solid rgba(127,178,255,.3)}
.band.braucht_dich{background:rgba(243,210,122,.1);border-color:rgba(243,210,122,.4);color:var(--text)}
.band span{flex:1;min-width:0}
.band .glasknopf{padding:.35rem .9rem;font-size:.82rem}
.rondell.aus{display:none}

/* Absprache Tony ⇄ Claude */
.absprache{position:absolute;inset:0;display:none;justify-content:center;overflow:auto;padding:0 1.6rem 1.2rem}
.absprache.an{display:flex}
.absprache .spalte{width:min(100%,62rem);display:flex;flex-direction:column;gap:.9rem;padding-top:.5rem}
.absprache h2{font-size:1.35rem;font-weight:600;letter-spacing:-.01em}
.absprache .unter{color:var(--text2);font-size:.95rem;margin-top:-.4rem;margin-bottom:.4rem}
.absprache .blase{max-width:78%;font-size:1.02rem}
.absprache .blase.claude{align-self:flex-end;border-radius:1.1rem 1.1rem .3rem 1.1rem;background:rgba(143,184,255,.16);border-color:rgba(143,184,255,.28)}
.absprache .blase.marcel{align-self:center;max-width:70%;background:rgba(127,224,176,.12);border-color:rgba(127,224,176,.25);border-radius:1.1rem}

/* Hinweis + Eingabe */
.unten{position:fixed;left:50%;bottom:1.4rem;transform:translateX(-50%);width:min(52rem,92vw);z-index:20;display:flex;flex-direction:column;gap:.7rem;align-items:center}
.hinweis{font-size:1rem;color:var(--text2);text-align:center;min-height:1.4rem}
.nav{display:flex;gap:.9rem;align-items:center;font-size:.8rem;color:var(--text3)}
.nav button{width:2.1rem;height:2.1rem;border-radius:50%;display:grid;place-items:center;background:var(--glas);border:1px solid var(--kante);font-size:1.1rem}
.eingabe{width:100%;display:flex;gap:.6rem;align-items:center;padding:.5rem .5rem .5rem 1.2rem;border-radius:999px;background:rgba(10,20,40,.94);border:1px solid var(--kante)}
.eingabe input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--text);font:inherit;font-size:1rem}
.eingabe input::placeholder{color:var(--text3)}
.eingabe .ziel{font-size:.8rem;color:var(--text3);white-space:nowrap;max-width:14rem;overflow:hidden;text-overflow:ellipsis}
.eingabe button{width:2.5rem;height:2.5rem;border-radius:50%;display:grid;place-items:center;background:linear-gradient(180deg,rgba(255,255,255,.2),rgba(255,255,255,.06));border:1px solid var(--kante-hell)}
.eingabe button svg{width:1rem;height:1rem}

.leerstand{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--text3);font-size:1.05rem;line-height:1.6}
.leerstand b{display:block;color:var(--text2);font-size:1.6rem;font-weight:500;margin-bottom:.4rem;letter-spacing:-.01em}
.schluessel{position:fixed;inset:0;display:grid;place-items:center;z-index:50;background:var(--bg)}
.schluessel form{display:flex;flex-direction:column;gap:.8rem;width:min(24rem,90vw)}
.schluessel input{padding:.8rem 1rem;border-radius:.8rem;background:var(--glas);border:1px solid var(--kante);color:var(--text);font:inherit}

@media (max-width:1100px){
  .todos{display:none}
  .mehr{grid-template-columns:16rem 1fr;gap:.9rem;padding:0 1rem 1rem}
  .fenster{width:92vw}
  .lage .stand p{font-size:1.3rem}
}
@media (max-width:700px){
  .kopf{padding:0 1rem}.live span{display:none}
  .umschalter button span.txt{display:none}
  .mehr{grid-template-columns:1fr;grid-template-rows:minmax(0,38%) 1fr;padding:0 .7rem .7rem}
  .sitzung .s-stand{-webkit-line-clamp:1}
}
</style>
</head>
<body>

<header class="kopf">
  <div class="marke"><div class="punkt"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 3l1.8 4.7L18.5 9.5l-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/></svg></div>Tony <span class="leise">/ Board</span></div>
  <div class="umschalter" id="umschalter">
    <button data-a="rondell"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><ellipse cx="12" cy="12" rx="9" ry="4"/><rect x="9" y="7" width="6" height="10" rx="1.5"/></svg><span class="txt">Rondell</span></button>
    <button data-a="mehrfenster"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="8" height="7" rx="1.5"/><rect x="13" y="4" width="8" height="7" rx="1.5"/><rect x="3" y="13" width="8" height="7" rx="1.5"/><rect x="13" y="13" width="8" height="7" rx="1.5"/></svg><span class="txt">Mehrfenster</span></button>
    <button data-a="absprache"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M4 5h11v8H8l-4 3z"/><path d="M15 9h5v8l-3-2h-6v-2"/></svg><span class="txt">Tony ⇄ Claude</span><span class="zahl" id="abzahl" hidden></span></button>
    <button data-a="archiv"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="3" y="4" width="18" height="4" rx="1"/><path d="M5 8v11h14V8M10 12h4"/></svg><span class="txt">Archiv</span></button>
  </div>
  <div class="live" id="live"><i></i><span>verbunden</span></div>
</header>

<aside class="todos"><h3>Bleibt im Blick</h3><ul id="todos"></ul></aside>

<main class="buehne">
  <div class="rondell" id="rondell"></div>
  <div class="mehr" id="mehr">
    <nav class="leiste" aria-label="Sitzungen"><div class="leiste-kopf" id="lkopf"></div><div class="leiste-liste" id="lliste"></div>
      <details class="leiste-todos"><summary>Bleibt im Blick</summary><ul id="ltodos"></ul></details></nav>
    <div class="detail" id="detail"></div>
  </div>
  <div class="absprache" id="absprache"><div class="spalte" id="abspalte"></div></div>
  <div class="archiv" id="archiv"><div class="spalte"><h2>Archiv</h2><input id="asuche" placeholder="Im Archiv suchen …" autocomplete="off"><div class="liste" id="aliste"></div></div></div>
</main>

<div class="unten">
  <div class="hinweis" id="hinweis"></div>
  <div class="nav" id="nav"><button id="zurueck" aria-label="Vorheriges Fenster">‹</button><span id="zaehler"></span><button id="vor" aria-label="Nächstes Fenster">›</button></div>
  <form class="eingabe" id="eingabe">
    <span class="ziel" id="ziel">An Tony</span>
    <input id="text" autocomplete="off" placeholder="Nachricht an Tony …">
    <button aria-label="Senden"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
  </form>
</div>

<script>
const API = "https://lzrfyxejlejxfpvqpket.supabase.co/functions/v1/tony-board/api/";
const LOGOS = {
  gmail:'<svg viewBox="0 0 48 48"><path fill="#4285F4" d="M6 40h7V22L4 15v22c0 1.7 1.3 3 2 3z"/><path fill="#34A853" d="M35 40h7c.7 0 2-1.3 2-3V15l-9 7z"/><path fill="#FBBC04" d="M35 10v12l9-7v-3c0-3.7-4.2-5.8-7.2-3.6z"/><path fill="#EA4335" d="M13 22V10l11 8.2L35 10v12l-11 8.2z"/><path fill="#C5221F" d="M4 12v3l9 7V10l-1.8-1.4C8.2 6.4 4 8.5 4 12z"/></svg>',
  outlook:'<svg viewBox="0 0 48 48"><rect x="16" y="8" width="26" height="32" rx="3" fill="#28A8EA"/><rect x="4" y="13" width="22" height="22" rx="3" fill="#0A64AD"/><ellipse cx="15" cy="24" rx="5.2" ry="6.3" fill="none" stroke="#fff" stroke-width="2.6"/></svg>',
  github:'<svg viewBox="0 0 24 24"><path fill="#111" d="M12 .5A11.5 11.5 0 0 0 8.4 22.9c.6.1.8-.3.8-.6v-2c-3.2.7-3.9-1.4-3.9-1.4-.5-1.3-1.3-1.7-1.3-1.7-1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1 1.8 2.8 1.3 3.5 1 .1-.8.4-1.3.7-1.6-2.6-.3-5.3-1.3-5.3-5.7 0-1.3.5-2.300 1.2-3.1-.1-.3-.5-1.5.1-3.1 0 0 1-.3 3.2 1.2a11 11 0 0 1 5.8 0c2.2-1.5 3.2-1.2 3.2-1.2.6 1.6.2 2.8.1 3.1.8.8 1.2 1.8 1.2 3.1 0 4.4-2.7 5.4-5.3 5.7.4.4.8 1.1.8 2.2v3.2c0 .3.2.7.8.6A11.5 11.5 0 0 0 12 .5z"/></svg>',
  jira:'<svg viewBox="0 0 24 24"><path fill="#2684FF" d="M22.2 11.3 12.7 1.8 12 1 4.8 8.2 1.8 11.3a1 1 0 0 0 0 1.4l6.5 6.5L12 23l7.2-7.2.1-.1 2.9-2.9a1 1 0 0 0 0-1.5zM12 15.1 8.9 12 12 8.9l3.1 3.1z"/></svg>',
  kalender:'<svg viewBox="0 0 24 24" fill="none"><rect x="3" y="4.5" width="18" height="16" rx="3" fill="#fff" stroke="#4285F4" stroke-width="1.6"/><path d="M3 9h18" stroke="#4285F4" stroke-width="1.6"/><path d="M8 3v3M16 3v3" stroke="#4285F4" stroke-width="1.6" stroke-linecap="round"/><text x="12" y="18" text-anchor="middle" font-size="7" font-family="Inter,sans-serif" font-weight="600" fill="#4285F4">31</text></svg>',
  drive:'<svg viewBox="0 0 48 48"><path fill="#0066DA" d="M6 38l4 7h28l4-7z"/><path fill="#00AC47" d="M17 6 4 29l4 7L21 13z"/><path fill="#FFBA00" d="M31 6H17l13 23h14z"/></svg>',
  slack:'<svg viewBox="0 0 24 24"><path fill="#E01E5A" d="M5 15a2 2 0 1 1-2-2h2zm1 0a2 2 0 0 1 4 0v5a2 2 0 0 1-4 0z"/><path fill="#36C5F0" d="M9 5a2 2 0 1 1 2-2v2zm0 1a2 2 0 0 1 0 4H4a2 2 0 0 1 0-4z"/><path fill="#2EB67D" d="M19 9a2 2 0 1 1 2 2h-2zm-1 0a2 2 0 0 1-4 0V4a2 2 0 0 1 4 0z"/><path fill="#ECB22E" d="M15 19a2 2 0 1 1-2 2v-2zm0-1a2 2 0 0 1 0-4h5a2 2 0 0 1 0 4z"/></svg>',
  notion:'<svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3" fill="#fff" stroke="#111" stroke-width="1.6"/><path d="M8.5 16.5v-9l7 9v-9" fill="none" stroke="#111" stroke-width="1.8" stroke-linejoin="round"/></svg>',
  web:'<svg viewBox="0 0 24 24" fill="none" stroke="#3b6ef5" stroke-width="1.7"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z"/></svg>',
  code:'<svg viewBox="0 0 24 24" fill="none" stroke="#5b3fd9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 7l-5 5 5 5M16 7l5 5-5 5"/></svg>',
  notiz:'<svg viewBox="0 0 24 24" fill="none" stroke="#6b5ad6" stroke-width="1.8" stroke-linecap="round"><rect x="5" y="3" width="14" height="18" rx="2.5"/><path d="M9 8h6M9 12h6M9 16h3"/></svg>',
  dokument:'<svg viewBox="0 0 24 24" fill="none" stroke="#2b7bd6" stroke-width="1.8" stroke-linejoin="round"><path d="M6 3h8l5 5v13H6z"/><path d="M14 3v5h5"/></svg>',
  noranotes:'<img src="logos/noranotes.png" alt="NoraNotes">'
};
const STATUS = {arbeitet:"Arbeitet", braucht_dich:"Braucht dich", wartet:"Wartet", fertig:"Fertig"};

let KEY = null;
try { KEY = new URLSearchParams(location.hash.slice(1)).get("k") || localStorage.getItem("tonyBoardKey"); } catch(e) {
  KEY = new URLSearchParams(location.hash.slice(1)).get("k");
}
if (KEY) { try { localStorage.setItem("tonyBoardKey", KEY); } catch(e) {} }

let zustand = {fenster:[], fokus:null, ansicht:"rondell", todos:[], absprache:[], eingang:[]};
let vorn = 0, letzterFokus = null, letzterStand = "", gesehenAb = 0;
try { gesehenAb = +localStorage.getItem("tonyAbGesehen") || 0; } catch(e) {}

const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const sichereUrl = u => /^https?:\/\//i.test(String(u||"")) ? esc(u) : "#";
function zeile(t){
  return t.replace(/\*\*(.+?)\*\*/g,"<b>$1</b>")
          .replace(/`([^`]+)`/g,"<code>$1</code>")
          .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>')
          .replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g,'$1<a href="$2" target="_blank" rel="noopener">$2</a>');
}
function markdown(t){
  const zeilen = esc(t).split(/\n/); let out = "", liste = null, absatz = [];
  const fl = () => { if (absatz.length){ out += "<p>"+absatz.map(zeile).join("<br>")+"</p>"; absatz = []; } };
  const fli = () => { if (liste){ out += `</${liste}>`; liste = null; } };
  for (const z of zeilen){
    let m;
    if (/^\s*$/.test(z)){ fl(); fli(); continue; }
    if ((m = z.match(/^#{1,4}\s+(.*)/))){ fl(); fli(); out += `<h3>${zeile(m[1])}</h3>`; continue; }
    if ((m = z.match(/^&gt;\s?(.*)/))){ fl(); fli(); out += `<blockquote>${zeile(m[1])}</blockquote>`; continue; }
    if ((m = z.match(/^\s*[-*•]\s+(.*)/))){ fl(); if (liste!=="ul"){ fli(); out+="<ul>"; liste="ul"; } out += `<li>${zeile(m[1])}</li>`; continue; }
    if ((m = z.match(/^\s*\d+[.)]\s+(.*)/))){ fl(); if (liste!=="ol"){ fli(); out+="<ol>"; liste="ol"; } out += `<li>${zeile(m[1])}</li>`; continue; }
    fli(); absatz.push(z);
  }
  fl(); fli();
  return out;
}

function widget(w){
  const d = w.daten || {}, t = w.titel ? `<h4>${esc(w.titel)}</h4>` : "";
  try {
    switch (w.typ){
      case "kennzahlen": return `<div class="w">${t}<div class="w-kennzahlen">${(d.werte||[]).map(k=>`<div class="w-zahl"><b>${esc(k.wert)}</b><span>${esc(k.label)}</span>${k.hinweis?`<small>${esc(k.hinweis)}</small>`:""}</div>`).join("")}</div></div>`;
      case "tabelle": return `<div class="w">${t}<table><thead><tr>${(d.spalten||[]).map(s=>`<th>${esc(s)}</th>`).join("")}</tr></thead><tbody>${(d.zeilen||[]).map(r=>`<tr>${(r||[]).map(c=>`<td>${zeile(esc(c))}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
      case "checkliste": return `<div class="w">${t}<ul class="w-check">${(d.punkte||[]).map(p=>`<li class="${p.erledigt?"erl":""}"><span class="k">${p.erledigt?"✓":""}</span>${esc(p.text)}</li>`).join("")}</ul></div>`;
      case "vergleich": { const s = x => x ? `<div><b>${esc(x.titel)}</b><ul>${(x.punkte||[]).map(p=>`<li>${esc(p)}</li>`).join("")}</ul></div>` : "<div></div>";
        return `<div class="w">${t}<div class="w-vergleich">${s(d.links)}${s(d.rechts)}</div></div>`; }
      case "balken": { const max = Math.max(1, ...(d.werte||[]).map(v=>+v.wert||0));
        return `<div class="w">${t}<div class="w-balken">${(d.werte||[]).map(v=>`<div class="z"><span>${esc(v.label)}</span><span class="spur"><i style="width:${Math.max(2,(+v.wert||0)/max*100)}%"></i></span><span>${esc(v.wert)}${d.einheit?" "+esc(d.einheit):""}</span></div>`).join("")}</div></div>`; }
      case "links": return `<div class="w">${t}<div class="w-links">${(d.eintraege||[]).map(l=>`<a href="${sichereUrl(l.url)}" target="_blank" rel="noopener"><b>${esc(l.titel||l.url)}</b><small>${esc(l.url)}</small>${l.beschreibung?`<span>${esc(l.beschreibung)}</span>`:""}</a>`).join("")}</div></div>`;
      case "zitat": return `<div class="w">${t}<div class="w-zitat">„${esc(d.text)}“${d.quelle?`<small>${esc(d.quelle)}</small>`:""}</div></div>`;
      case "bild": return `<div class="w">${t}<img src="${sichereUrl(d.url)}" alt="${esc(d.alt)}"></div>`;
      case "mockup": return `<div class="w">${t}<iframe sandbox="" referrerpolicy="no-referrer" srcdoc="${esc(d.html||"")}"></iframe></div>`;
    }
  } catch(e) {}
  return "";
}

function verlaufHTML(v){
  if (!v || !v.length) return "";
  return `<div class="verlauf">${v.map(n=>`<div class="blase ${n.eigen?"eigen":""}"><div class="wer"><b>${esc(n.wer)}</b>${n.zeit?`<span>${esc(n.zeit)}</span>`:""}</div>${markdown(n.text)}</div>`).join("")}</div>`;
}

function fensterHTML(f){
  const kopf = f.kopf && Object.keys(f.kopf).length
    ? `<dl class="f-meta">${Object.entries(f.kopf).map(([k,v])=>`<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("")}</dl>` : "";
  const text = f.inhalt ? `<div class="f-inhalt ${f.art==="code"?"code":""}">${f.art==="code"?esc(f.inhalt):markdown(f.inhalt)}</div>` : "";
  const verlauf = verlaufHTML(f.verlauf);
  const ws = (f.widgets||[]).map(w => widget(w).replace('<div class="w">', `<div class="w${["tabelle","mockup","vergleich"].includes(w.typ)?" breit":""}">`)).join("");
  // Widgets zuerst; Fliesstext nur eingeklappt, ausser bei Mails/Chats oder wenn es nichts anderes gibt
  const textOffen = f.art === "mail" || f.art === "chat" || !ws;
  const details = (kopf || text || verlauf)
    ? (textOffen ? `${kopf}${f.art==="chat"?verlauf+text:text+verlauf}` : `<details class="mehr-text"><summary>Details lesen</summary><div>${kopf}${text}${verlauf}</div></details>`)
    : "";
  const schritte = (f.schritte||[]).map(s=>`<span class="schritt ${s.erledigt?"erl":s.aktuell?"akt":""}"><span class="k">${s.erledigt?"✓":""}</span>${esc(s.text)}</span>`).join("");
  let freigabe = "";
  if (f.freigabe === "angefragt") freigabe = `<div class="freigabe"><button class="glasknopf" data-ab="${esc(f.id)}">Ändern …</button><button class="glasknopf ja" data-ja="${esc(f.id)}">Freigeben</button></div>`;
  else if (f.freigabe === "freigegeben") freigabe = `<span class="marke-frei">Freigegeben</span>`;
  else if (f.freigabe === "abgelehnt") freigabe = `<span class="marke-ab">Änderung gewünscht</span>`;
  const archiv = `<button class="leise-knopf" data-archiv="${esc(f.id)}" style="${freigabe?"":"margin-left:auto"}">Archivieren</button>`;
  return `<div class="f-kopf"><div class="logo">${LOGOS[f.app]||LOGOS.notiz}</div>
      <div class="f-titel"><small>${esc(f.app)}</small><b>${esc(f.titel)}</b>${f.geaendert?`<small class="frisch" data-t="${esc(f.geaendert)}"></small>`:""}</div>
      <div class="status ${esc(f.status)}"><i></i>${STATUS[f.status]||esc(f.status)}</div></div>
    ${(f.auftrag||f.kernaussage||f.von_dir)?`<div class="lage">
      ${f.auftrag?`<div class="z"><span>Auftrag</span><p>${zeile(esc(f.auftrag))}</p></div>`:""}
      ${f.kernaussage?`<div class="z stand"><span>Stand</span><p>${zeile(esc(f.kernaussage))}${f.status==="arbeitet"?'<span class="laeuft" aria-label="wird bearbeitet"><i></i><i></i><i></i></span>':""}</p></div>`:""}
      ${f.von_dir?`<div class="z ${f.status==="braucht_dich"?"vondir":""}"><span>${f.status==="braucht_dich"?"Frage an dich":"Offen"}</span><p>${zeile(esc(f.von_dir))}</p></div>`:""}
    </div>`:""}
    <div class="f-koerper"><div class="f-spalte">
      ${ws?`<div class="widgets">${ws}</div>`:""}
      ${details || (ws?"":'<div class="f-inhalt" style="color:var(--text3)">Tony bereitet den Inhalt vor …</div>')}
    </div></div>
    <div class="f-fuss">${schritte}${freigabe}${archiv}</div>`;
}

function archivZeichnen(){
  const q = (document.getElementById("asuche").value||"").toLowerCase().trim();
  const liste = (zustand.archiv||[]).filter(a => !q || (a.titel+" "+(a.kernaussage||"")).toLowerCase().includes(q));
  document.getElementById("aliste").innerHTML = liste.length
    ? liste.map(a=>`<button class="akarte" data-zurueck="${esc(a.id)}"><div class="logo">${LOGOS[a.app]||LOGOS.notiz}</div><div><b>${esc(a.titel)}</b>${a.kernaussage?`<span>${zeile(esc(a.kernaussage))}</span>`:""}<small>${new Date(a.geaendert).toLocaleString("de-DE",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"})} · zurück aufs Board</small></div></button>`).join("")
    : `<div style="color:var(--text3);padding:2rem 0">${q?"Nichts gefunden.":"Noch nichts archiviert."}</div>`;
}

function zeit(iso){ try { return new Date(iso).toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"}); } catch(e){ return ""; } }

function absprachZeichnen(){
  const ab = (zustand.absprache||[]).map(m=>({wer:m.von, text:m.text, t:m.erstellt, id:m.id}));
  const mein = (zustand.eingang||[]).filter(e=>e.art==="nachricht").map(e=>({wer:"marcel", text:e.text, t:e.erstellt}));
  const alle = ab.concat(mein).sort((a,b)=>a.t<b.t?-1:1);
  const name = {tony:"Tony", claude:"Claude", marcel:"Du an Tony"};
  document.getElementById("abspalte").innerHTML =
    `<h2>Tony ⇄ Claude</h2><div class="unter">Was die beiden untereinander absprechen. Claude schaut jede Minute nach.</div>` +
    (alle.length ? alle.map(n=>`<div class="blase ${n.wer}"><div class="wer"><b>${name[n.wer]}</b><span>${zeit(n.t)}</span></div>${markdown(n.text)}</div>`).join("")
                 : `<div class="leerstand" style="position:static;padding:4rem 0"><div><b>Noch keine Absprache.</b>Sobald Tony Claude etwas übergibt, steht es hier.</div></div>`);
  const neu = ab.filter(m=>m.id > gesehenAb).length;
  const z = document.getElementById("abzahl");
  if (zustand.ansicht === "absprache"){ const max = Math.max(0,...ab.map(m=>m.id)); if (max > gesehenAb){ gesehenAb = max; try{localStorage.setItem("tonyAbGesehen",max);}catch(e){} } z.hidden = true; }
  else { z.hidden = !neu; z.textContent = neu; }
}

function zeichnen(){
  const F = zustand.fenster, a = zustand.ansicht;
  document.getElementById("todos").innerHTML = zustand.todos.length ? zustand.todos.map(t=>`<li class="${t.erledigt?"erl":""}"><span class="box"></span>${esc(t.text)}</li>`).join("") : `<li class="leer">Noch keine To-dos.</li>`;
  document.querySelectorAll("#umschalter button").forEach(b=>b.classList.toggle("an", b.dataset.a===a));
  document.getElementById("rondell").classList.toggle("aus", a!=="rondell");
  document.getElementById("mehr").classList.toggle("an", a==="mehrfenster");
  document.getElementById("absprache").classList.toggle("an", a==="absprache");
  document.body.classList.toggle("v-mehrfenster", a==="mehrfenster");
  document.getElementById("archiv").classList.toggle("an", a==="archiv");
  archivZeichnen();
  document.getElementById("nav").style.visibility = (a==="rondell" && F.length>1) ? "visible" : "hidden";
  document.getElementById("hinweis").style.visibility = a==="rondell" ? "visible" : "hidden";
  absprachZeichnen();

  const r = document.getElementById("rondell");
  if (!F.length){
    r.innerHTML = `<div class="leerstand"><div><b>Tony zeigt gerade keine Aufgabe.</b>Sobald er an etwas arbeitet, erscheint es hier.</div></div>`;
    leisteZeichnen();
    document.getElementById("detail").innerHTML = `<div class="leerstand" style="position:static;padding:4rem 0"><div><b>Keine offene Sitzung.</b>Sobald Tony an etwas arbeitet, steht es links.</div></div>`;
    gezeigt = null;
    document.getElementById("hinweis").textContent = "";
    document.getElementById("ziel").textContent = "An Tony";
    return;
  }
  vorn = Math.max(0, Math.min(vorn, F.length-1));
  // Scrollstand im vorderen Fenster beim Neuzeichnen behalten
  const alt = {}; document.querySelectorAll("#rondell .fenster .f-koerper").forEach((el,i)=>alt[i]=el.scrollTop);
  const offen = new Set([...document.querySelectorAll("#rondell .fenster details[open]")].map(d=>d.closest(".fenster").dataset.i));
  r.innerHTML = F.map((f,i)=>fensterSection(f,i)).join("");
  document.querySelectorAll("#rondell .fenster details").forEach(d=>{ if (offen.has(d.closest(".fenster").dataset.i)) d.open = true; });
  document.querySelectorAll("#rondell .fenster .f-koerper").forEach((el,i)=>{ if (alt[i]) el.scrollTop = alt[i]; });
  leisteZeichnen();
  detailZeichnen(true);
  frischeZeigen();
  drehen();
}

const fensterSection = (f,i) => `<section class="fenster ${f.status==="braucht_dich"?"braucht":""} ${f.status==="arbeitet"?"arbeitet":""}" data-i="${i}">${fensterHTML(f)}</section>`;

/* Mehrfenster: Auswahl durch Marcel hat Vorrang vor Tonys Fokus.
   auswahl = geklickt, angetippt oder mit der Maus kurz angesteuert; sie bleibt stehen, bis die naechste Wahl kommt.
   Ohne Auswahl folgt die Ansicht Tony (Fokus, sonst was dich braucht, sonst was laeuft).
   Tony verdraengt eine Auswahl nie; sein neuer Fokus erscheint nur als Band ueber dem Inhalt. */
const PRIO = ["braucht_dich","arbeitet","wartet","fertig"];
let auswahl = null, gezeigt = null;
const finde = id => zustand.fenster.find(f=>f.id===id);
const prio = s => { const i = PRIO.indexOf(s); return i < 0 ? 2 : i; };
function tonysWahl(){
  const F = zustand.fenster;
  return finde(zustand.fokus) || F.find(f=>f.status==="braucht_dich") || F.find(f=>f.status==="arbeitet") || F[0];
}
function gewaehlt(){ return finde(auswahl) || tonysWahl(); }

function leisteZeichnen(){
  const F = zustand.fenster;
  const zahl = s => F.filter(f=>f.status===s).length;
  const teile = [["braucht_dich","braucht dich","brauchen dich"],["arbeitet","arbeitet","arbeiten"],["wartet","wartet","warten"]]
    .map(([s,e,m])=>{ const n = zahl(s); return n ? `${n} ${n===1?e:m}` : ""; }).filter(Boolean);
  document.getElementById("lkopf").innerHTML = `<b>Sitzungen · ${F.length}</b><span>${teile.join(" · ") || "nichts offen"}</span>`;
  const sortiert = F.map((f,i)=>({f,i})).sort((a,b)=>prio(a.f.status)-prio(b.f.status) || a.i-b.i);
  const sel = gewaehlt()?.id;
  let gruppe = null, html = "";
  for (const {f} of sortiert){
    if (f.status !== gruppe){ gruppe = f.status; html += `<div class="gruppe ${esc(f.status)}">${STATUS[f.status]||esc(f.status)}</div>`; }
    const frage = f.status!=="braucht_dich" ? "" : f.von_dir ? f.von_dir : f.freigabe==="angefragt" ? "Freigabe: Freigeben oder Ändern?" : "Frage fehlt – Tony muss sie nennen";
    const unter = frage ? `<span class="s-stand vondir">${zeile(esc(frage))}</span>` : f.kernaussage ? `<span class="s-stand">${zeile(esc(f.kernaussage))}</span>` : "";
    html += `<button class="sitzung ${esc(f.status)} ${f.id===sel?"gewaehlt":""}" data-sid="${esc(f.id)}" aria-current="${f.id===sel}">
      <div class="logo">${LOGOS[f.app]||LOGOS.notiz}</div>
      <div class="s-text"><b title="${esc(f.titel)}">${esc(f.titel)}${f.id===zustand.fokus?'<span class="tony">Tony hier</span>':""}</b>
        <div class="s-zeile"><span class="status ${esc(f.status)}"><i></i>${STATUS[f.status]||esc(f.status)}</span>${f.geaendert?`<small class="frisch" data-t="${esc(f.geaendert)}"></small>`:""}</div>
        ${unter}</div></button>`;
  }
  document.getElementById("lliste").innerHTML = html;
  document.getElementById("ltodos").innerHTML = zustand.todos.length ? zustand.todos.map(t=>`<li class="${t.erledigt?"erl":""}"><span class="box"></span>${esc(t.text)}</li>`).join("") : `<li style="color:var(--text3)">Noch keine To-dos.</li>`;
}

function detailZeichnen(neuerStand){
  const d = document.getElementById("detail");
  if (!zustand.fenster.length) return;
  const f = gewaehlt(), tony = tonysWahl();
  let band = "";
  if (auswahl && tony && tony.id !== f.id){
    const b = tony.status==="braucht_dich";
    band = `<div class="band ${b?"braucht_dich":""}"><span>${b?"Braucht dich":"Tony ist gerade bei"}: <b>${esc(tony.titel)}</b></span><button class="glasknopf" data-folgen>Dorthin</button></div>`;
  }
  const i = zustand.fenster.indexOf(f);
  const schluessel = f.id + "|" + band;
  if (!neuerStand && schluessel === gezeigt) return;
  const gleich = gezeigt && gezeigt.split("|")[0] === f.id;
  const k = d.querySelector(".f-koerper"), top = gleich && k ? k.scrollTop : 0;
  const offen = gleich && !!d.querySelector("details.mehr-text[open]");
  d.innerHTML = band + fensterSection(f,i);
  if (!gleich) d.querySelector(".fenster")?.classList.add("neu");
  if (offen) d.querySelector("details.mehr-text")?.setAttribute("open","");
  if (top) d.querySelector(".f-koerper").scrollTop = top;
  gezeigt = schluessel;
  frischeZeigen();
  zielSetzen();
}

function zielSetzen(){
  const f = zustand.ansicht === "rondell" ? zustand.fenster[vorn] : zustand.ansicht === "mehrfenster" ? gewaehlt() : null;
  document.getElementById("ziel").textContent = f ? `Zu: ${f.titel}` : "An Tony";
}

function waehlen(id){
  auswahl = id;
  const i = zustand.fenster.findIndex(f=>f.id===id); if (i >= 0) vorn = i;
  leisteZeichnen(); detailZeichnen(); drehen();
}

// Letzte Meldung je Fenster; arbeitet ohne Meldung seit 15 Min. -> Animation aus, gelb markiert
function frischeZeigen(){
  document.querySelectorAll(".frisch").forEach(el=>{
    const min = Math.floor((Date.now() - new Date(el.dataset.t)) / 60000);
    const fe = el.closest(".fenster, .sitzung");
    const alt = fe.classList.contains("arbeitet") && min >= 15;
    el.textContent = "letzte Meldung " + (min < 1 ? "gerade eben" : min < 60 ? `vor ${min} Min.` : zeit(el.dataset.t) + " Uhr");
    if (alt) el.textContent = "keine Meldung seit " + (min < 60 ? `${min} Min.` : zeit(el.dataset.t) + " Uhr");
    el.classList.toggle("alt", alt);
    fe.classList.toggle("still", alt);
  });
}

function drehen(){
  const F = zustand.fenster, n = F.length;
  document.querySelectorAll("#rondell .fenster").forEach(el=>{
    const i = +el.dataset.i;
    let d = i - vorn; if (d > n/2) d -= n; if (d < -n/2) d += n;
    const a = Math.abs(d);
    el.style.transform = `translate(-50%,-50%) translate3d(${d*44}%,0,${-a*22}rem) rotateY(${-d*30}deg)`;
    el.style.opacity = a > 1 ? 0 : 1 - a*0.55;
    el.style.visibility = a > 1 ? "hidden" : "visible";
    el.style.zIndex = 10 - a;
    el.style.pointerEvents = a > 1 ? "none" : "auto";
    el.classList.toggle("vorn", a===0);
  });
  const f = F[vorn];
  document.getElementById("zaehler").textContent = `${String(vorn+1).padStart(2,"0")} / ${String(n).padStart(2,"0")}`;
  document.getElementById("hinweis").textContent = f?.hinweis || "";
  zielSetzen();
}

async function laden(){
  try{
    const res = await fetch(API + KEY + "/state", {cache:"no-store"});
    if (!res.ok) throw new Error(res.status);
    const z = await res.json();
    document.getElementById("live").classList.remove("aus");
    document.querySelector("#live span").textContent = "verbunden";
    const stand = JSON.stringify([z.fenster, z.fokus, z.ansicht, z.todos, z.absprache, z.eingang, z.archiv]);
    if (stand === letzterStand) return;
    letzterStand = stand;
    zustand = z;
    if (z.fokus !== letzterFokus){
      const i = z.fenster.findIndex(f=>f.id===z.fokus);
      if (i >= 0) vorn = i;
      letzterFokus = z.fokus;
    }
    zeichnen();
  }catch(e){
    document.getElementById("live").classList.add("aus");
    document.querySelector("#live span").textContent = "keine Verbindung";
  }
}

async function senden(pfad, daten){
  await fetch(API + KEY + "/" + pfad, {method:"POST", headers:{"content-type":"application/json"}, body:JSON.stringify(daten)});
  letzterStand = ""; laden();
}

function schritt(d){ const n = zustand.fenster.length; if (!n) return; vorn = (vorn + d + n) % n; drehen(); }

function start(){
  document.getElementById("zurueck").onclick = () => schritt(-1);
  document.getElementById("vor").onclick = () => schritt(1);
  document.addEventListener("keydown", e => { if (e.target.tagName === "INPUT") return;
    if (zustand.ansicht === "mehrfenster" && (e.key==="ArrowUp" || e.key==="ArrowDown")){
      const ids = [...document.querySelectorAll("#lliste .sitzung")].map(b=>b.dataset.sid);
      const n = ids.indexOf(gewaehlt()?.id) + (e.key==="ArrowDown" ? 1 : -1);
      if (ids[n]){ e.preventDefault(); waehlen(ids[n]); document.querySelector(`#lliste [data-sid="${CSS.escape(ids[n])}"]`)?.focus(); }
      return;
    }
    if (e.key==="ArrowLeft") schritt(-1); if (e.key==="ArrowRight") schritt(1); });
  // Sitzungsleiste: Klick/Antippen waehlt; Maus-Schweben (nur echte Maus) waehlt nach kurzer Ruhe ebenfalls und bleibt stehen
  const liste = document.getElementById("lliste");
  // Nur echte Bewegung zaehlt: Neuzeichnen unter einer ruhenden Maus loest sonst Hover-Ereignisse aus
  let schwebe = null, mx = -1, my = -1;
  liste.addEventListener("click", e => { const b = e.target.closest("[data-sid]"); if (b) waehlen(b.dataset.sid); });
  liste.addEventListener("pointermove", e => {
    if (e.pointerType !== "mouse" || (e.clientX === mx && e.clientY === my)) return;
    mx = e.clientX; my = e.clientY;
    const b = e.target.closest("[data-sid]");
    clearTimeout(schwebe);
    if (!b || b.dataset.sid === gewaehlt()?.id) return;
    schwebe = setTimeout(() => waehlen(b.dataset.sid), 250);
  });
  liste.addEventListener("pointerleave", () => clearTimeout(schwebe));
  // Rad/Trackpad: eine Geste = genau ein Fenster weiter. Gesperrt, bis 300 ms lang keine Radbewegung mehr kam
  // (Trackpad-Nachlauf feuert sonst Dutzende Ereignisse). Ueber dem Inhalt des vorderen Fensters wird normal gescrollt.
  let summe = 0, gesperrt = false, ruhe = null;
  document.getElementById("rondell").addEventListener("wheel", e => {
    if (e.target.closest(".fenster.vorn .f-koerper")) return;
    e.preventDefault();
    clearTimeout(ruhe); ruhe = setTimeout(() => { gesperrt = false; summe = 0; }, 300);
    if (gesperrt) return;
    summe += Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
    if (Math.abs(summe) < 60) return;
    schritt(summe > 0 ? 1 : -1); gesperrt = true; summe = 0;
  }, {passive:false});
  let tx = null;
  document.getElementById("rondell").addEventListener("touchstart", e => tx = e.touches[0].clientX, {passive:true});
  document.getElementById("rondell").addEventListener("touchend", e => { if (tx===null) return; const d = e.changedTouches[0].clientX - tx; if (Math.abs(d) > 60) schritt(d < 0 ? 1 : -1); tx = null; });
  document.querySelector(".buehne").addEventListener("click", e => {
    const ar = e.target.closest("[data-archiv]"), zu = e.target.closest("[data-zurueck]");
    if (ar) { zustand.fenster = zustand.fenster.filter(f=>f.id!==ar.dataset.archiv); zeichnen(); senden("archivieren", {id: ar.dataset.archiv}); return; }
    if (zu) { zustand.ansicht = "rondell"; letzterFokus = null; senden("archivieren", {id: zu.dataset.zurueck, zurueck:true}); return; }
    const ja = e.target.closest("[data-ja]"), ab = e.target.closest("[data-ab]");
    if (ja) { senden("eingabe", {fenster_id: ja.dataset.ja, art:"freigabe", text:"Freigegeben"}); return; }
    if (ab) {
      const w = prompt("Was soll Tony ändern?");
      if (w !== null) senden("eingabe", {fenster_id: ab.dataset.ab, art:"ablehnung", text: w || "Bitte überarbeiten"});
      return;
    }
    if (e.target.closest("[data-folgen]")) { auswahl = null; leisteZeichnen(); detailZeichnen(); return; }
    const f = e.target.closest("#rondell .fenster:not(.vorn)");
    if (f) { vorn = +f.dataset.i; drehen(); }
  });
  document.getElementById("umschalter").addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    zustand.ansicht = b.dataset.a; zeichnen(); zielSetzen();
    if (b.dataset.a === "rondell" || b.dataset.a === "mehrfenster") senden("ansicht", {ansicht: b.dataset.a});
  });
  document.getElementById("eingabe").addEventListener("submit", e => {
    e.preventDefault();
    const t = document.getElementById("text"); const text = t.value.trim(); if (!text) return;
    const f = zustand.ansicht === "rondell" ? zustand.fenster[vorn] : zustand.ansicht === "mehrfenster" ? gewaehlt() : null;
    senden("eingabe", {fenster_id: f?.id ?? null, art:"nachricht", text});
    t.value = ""; t.placeholder = "Gesendet. Tony liest es beim nächsten Blick aufs Board.";
  });
  document.getElementById("asuche").addEventListener("input", archivZeichnen);
  laden(); setInterval(laden, 1500); setInterval(frischeZeigen, 20000);
}

if (KEY) start();
else {
  document.body.insertAdjacentHTML("beforeend", `<div class="schluessel"><form id="sf"><b>Tony Board</b><input id="sk" placeholder="Zugangsschlüssel"><button class="glasknopf">Öffnen</button></form></div>`);
  document.getElementById("sf").onsubmit = e => { e.preventDefault(); location.hash = "k=" + document.getElementById("sk").value.trim(); location.reload(); };
}
</script>
</body>
</html>
