<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Tony Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#060c18; --bg2:#0c1830;
  --glas:rgba(255,255,255,.055); --glas-stark:rgba(255,255,255,.09);
  --kante:rgba(255,255,255,.14); --kante-hell:rgba(255,255,255,.3);
  --text:#f1f0f8; --text2:rgba(241,240,248,.72); --text3:rgba(241,240,248,.55);
  --gruen:#7fe0b0; --gelb:#f3d27a; --violett:#7fb2ff; --blau:#8fb8ff; --rot:#ff8f8f;
}
/* Alles skaliert mit der Bildschirmbreite: 16 px am Laptop, bis 30 px auf 4K */
html{font-size:clamp(15px, .6vw + 8px, 32px)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:Inter,system-ui,sans-serif;color:var(--text);line-height:1.5;
  background:
    radial-gradient(70vw 45vw at 50% 55%, rgba(56,120,255,.16), transparent 60%),
    radial-gradient(50vw 30vw at 85% 8%, rgba(60,200,255,.07), transparent 60%),
    linear-gradient(180deg,var(--bg2),var(--bg));
  overflow:hidden;-webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:var(--blau);text-decoration:none}a:hover{text-decoration:underline}

/* Einstieg eines Mitarbeiters */
.einstieg{display:flex;flex-direction:column;gap:.7rem;padding:1rem 1.1rem;margin-bottom:.9rem;border-radius:1.1rem;background:var(--glas);border:1px solid var(--kante)}
.e-kopf{display:flex;align-items:center;gap:.8rem}
.e-kopf small{display:block;color:var(--text3);font-size:.75rem}
.e-kopf b{font-size:1.05rem}
.e-avatar{width:2.4rem;height:2.4rem;border-radius:50%;display:grid;place-items:center;flex:none;font-weight:700;font-size:.8rem;color:#0a0a0b;background:linear-gradient(180deg,#fff,#ececee 48%,#d4d4d8 52%,#e6e6e9)}
.e-label{color:var(--text3);font-size:.7rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.e-kette{display:flex;align-items:stretch;gap:.4rem}
.e-schritt{flex:1;min-width:0;padding:.55rem .7rem;border-radius:.7rem;border:1px solid var(--kante);font-size:.82rem;background:rgba(255,255,255,.04)}
.e-schritt.letzter{border-color:var(--rot)}
.e-pfeil{align-self:center;color:var(--text3)}
.e-zahlen{display:grid;grid-template-columns:repeat(auto-fit,minmax(7rem,1fr));gap:.5rem}
.e-zahl{padding:.55rem .75rem;border-radius:.7rem;background:var(--glas-stark)}
.e-zahl span{display:block;color:var(--text2);font-size:.72rem}
.e-zahl b{font-size:1.3rem;font-weight:600}
.e-stand{display:flex;gap:.4rem}
.e-stufe{flex:1;text-align:center;padding:.3rem;border-radius:.6rem;font-size:.75rem;color:var(--text2);border:1px dashed var(--kante-hell)}
.e-stufe.ok{border:1px solid var(--gruen);background:rgba(127,224,176,.16);color:var(--text)}
.e-empf{padding:.75rem .9rem;border-radius:.8rem;border:1px solid #a8c7c2;background:rgba(168,199,194,.08)}
.e-empf small{display:block;color:#a8c7c2;font-size:.72rem}
.e-empf b{font-weight:600}
.e-empf p{margin-top:.35rem;color:var(--text2);font-size:.82rem}
.e-empf p i{display:inline-block;width:.45rem;height:.45rem;border-radius:50%;background:var(--gelb);margin-right:.45rem}
.e-frage{font-weight:500}

/* Kopf */
.kopf{position:fixed;inset:0 0 auto 0;height:4.4rem;display:flex;align-items:center;justify-content:space-between;padding:0 1.6rem;z-index:20}
.marke{display:flex;align-items:center;gap:.7rem;font-weight:600;font-size:1.15rem;letter-spacing:-.01em}
.marke .punkt{width:2.2rem;height:2.2rem;border-radius:.7rem;display:grid;place-items:center;background:var(--glas-stark);border:1px solid var(--kante)}
.marke .punkt svg{width:1.15rem;height:1.15rem}
.marke span.leise{color:var(--text3);font-weight:500}
.live{display:flex;align-items:center;gap:.5rem;font-size:.8rem;color:var(--text2)}
.live i{width:.45rem;height:.45rem;border-radius:50%;background:var(--gruen)}
.live.aus i{background:#ff7a7a}
.umschalter{display:flex;gap:.25rem;padding:.25rem;border-radius:999px;background:rgba(255,255,255,.04);border:1px solid var(--kante)}
.umschalter button{padding:.5rem 1.05rem;border-radius:999px;font-size:.85rem;color:var(--text2);display:flex;gap:.45rem;align-items:center}
.umschalter button svg{width:.95rem;height:.95rem}
.umschalter button.an{background:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,.06));color:var(--text);box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 .3rem .9rem rgba(0,0,0,.35)}
.umschalter .zahl{font-size:.7rem;min-width:1.1rem;padding:0 .3rem;border-radius:999px;background:rgba(127,178,255,.25);color:var(--text)}

/* To-dos */
.todos{position:fixed;left:1.6rem;top:5.4rem;width:17rem;z-index:15;padding:1rem 1rem .8rem;border-radius:1.1rem;
  background:rgba(10,20,40,.92);border:1px solid var(--kante)}
.todos h3{font-size:.78rem;font-weight:600;color:var(--text2);letter-spacing:.02em;margin-bottom:.6rem}
.todos ul{list-style:none;display:flex;flex-direction:column;gap:.5rem}
.todos li{display:flex;gap:.6rem;font-size:.88rem;line-height:1.35}
.todos li .box{flex:none;width:.95rem;height:.95rem;margin-top:.1rem;border-radius:.3rem;border:1px solid var(--kante-hell)}
.todos li.erl{color:var(--text3);text-decoration:line-through}
.todos li.erl .box{background:var(--gruen);border-color:var(--gruen)}
.todos .leer{font-size:.8rem;color:var(--text3)}
.todos ul{max-height:calc(100vh - 17rem);overflow:auto}
button.box{cursor:pointer}button.box:hover{background:rgba(127,224,176,.3);border-color:var(--gruen)}
.b-text small{display:block;font-size:.72rem;color:var(--text3);margin-top:.1rem}
.b-text small.termin{color:var(--text2)}
.b-text small.termin.faellig{color:var(--gelb)}
.b-text small.termin.offen{color:var(--text3);font-style:italic}
.todos h3 b.f{color:var(--gelb);font-weight:600}
.b-text.link{cursor:pointer}.b-text.link:hover{color:var(--blau)}

/* Drei Rondelle: je Bereich eines */
.bereiche{position:fixed;top:4.7rem;left:50%;transform:translateX(-50%);z-index:16;display:none;gap:.25rem;padding:.25rem;border-radius:999px;background:rgba(10,20,40,.88);border:1px solid var(--kante)}
body.v-rondell .bereiche{display:flex}
.bereiche button{padding:.4rem .95rem;border-radius:999px;font-size:.82rem;color:var(--text2);display:flex;gap:.45rem;align-items:center;white-space:nowrap}
.bereiche button.an{background:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,.06));color:var(--text)}
.bereiche .n{font-size:.7rem;color:var(--text3)}
.bereiche .dich{width:.5rem;height:.5rem;border-radius:50%;background:var(--gelb)}

/* Bühne */
.buehne{position:fixed;inset:4.4rem 0 8.6rem 0}
.rondell{position:absolute;inset:3rem 0 0 0;perspective:120rem}
.fenster{
  position:absolute;left:50%;top:50%;
  width:min(62vw, 100rem);height:min(calc(100% - 2.5rem), 58rem);
  border-radius:1.4rem;
  background:linear-gradient(160deg,rgba(38,58,96,.96),rgba(16,28,52,.97) 45%,rgba(20,34,62,.97));
  border:1px solid var(--kante);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 2rem 5rem rgba(0,0,0,.5);
  display:flex;flex-direction:column;overflow:hidden;
  transition:transform .55s cubic-bezier(.22,.9,.24,1),opacity .55s;
  will-change:transform,opacity;backface-visibility:hidden;cursor:pointer;
}
.fenster.vorn{cursor:default;border-color:var(--kante-hell)}
.fenster.braucht{border-color:rgba(243,210,122,.55)}
.fenster.fehlerhaft{border-color:rgba(255,143,143,.5)}
.f-kopf{display:flex;align-items:center;gap:1rem;padding:1.2rem 1.5rem 1rem;border-bottom:1px solid rgba(255,255,255,.08)}
.logo{flex:none;width:2.9rem;height:2.9rem;border-radius:.85rem;display:grid;place-items:center;background:rgba(255,255,255,.94);box-shadow:0 .3rem .9rem rgba(0,0,0,.3)}
.logo svg{width:1.75rem;height:1.75rem}
.logo img{width:2.3rem;height:2.3rem;object-fit:contain}
.akarte .logo img{width:1.85rem;height:1.85rem}
.f-titel{flex:1;min-width:0}
.f-titel small{display:block;font-size:.75rem;color:var(--text3);text-transform:capitalize;margin-bottom:.1rem}
.f-titel b{display:block;font-size:1.3rem;font-weight:600;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* Statusmarke: ein Wort, abgeleitet aus derselben Lage wie die Statusleiste */
.status{font-size:.8rem;color:var(--text2);display:flex;align-items:center;gap:.4rem;white-space:nowrap;padding:.35rem .8rem;border-radius:999px;border:1px solid var(--kante)}
.status i{width:.45rem;height:.45rem;border-radius:50%;background:var(--violett);flex:none}
.status.marcel{border-color:rgba(243,210,122,.5);color:var(--text)}.status.marcel i{background:var(--gelb)}
.status.fehler{border-color:rgba(255,143,143,.5);color:var(--text)}.status.fehler i{background:var(--rot)}
.status.fertig i{background:var(--gruen)}
.status.zugang i{background:var(--gelb);box-shadow:0 0 0 .13rem rgba(243,210,122,.25)}
.status.wartet i,.status.extern i,.status.agent i,.status.unbestaetigt i{background:none;border:1px dashed var(--text3)}
/* Aktivitaet: nur bestaetigt laufende Arbeit bewegt sich; Warten, Fehler und Fertig bleiben ruhig */
.status.arbeitet i{animation:puls 1.6s ease-in-out infinite}
@keyframes puls{0%,100%{box-shadow:0 0 0 0 rgba(127,178,255,.6)}50%{box-shadow:0 0 0 .3rem rgba(127,178,255,0)}}
.lage .stand .laeuft{display:inline-flex;gap:.18rem;margin-left:.45rem;vertical-align:middle}
.lage .stand .laeuft i{width:.3rem;height:.3rem;border-radius:50%;background:var(--violett);animation:tupf 1.2s ease-in-out infinite}
.lage .stand .laeuft i:nth-child(2){animation-delay:.2s}.lage .stand .laeuft i:nth-child(3){animation-delay:.4s}
@keyframes tupf{0%,80%,100%{opacity:.25}40%{opacity:1}}
.fenster.aktiv .schritt.akt .k{border-color:var(--violett) transparent var(--violett) var(--violett);background:none;animation:dreh 1s linear infinite}
@keyframes dreh{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){
  .status.arbeitet i,.laeuft i,.fenster.aktiv .schritt.akt .k{animation:none}
  .fenster.aktiv .schritt.akt .k{border-color:var(--violett);background:rgba(127,178,255,.45)}
}

/* Statusleiste in der Karte: wer tut gerade was, worauf wartet es, was kommt als Naechstes.
   Eine Karte sieht nur dann beschaeftigt aus, wenn ein frisches bestaetigtes Signal da ist. */
.sl{padding:.85rem 1.5rem .95rem;border-bottom:1px solid rgba(255,255,255,.08);display:flex;flex-direction:column;gap:.5rem;
  background:rgba(127,178,255,.07)}
.sl .wort{display:flex;align-items:baseline;gap:.5rem;font-size:1.1rem;font-weight:600;letter-spacing:-.01em;line-height:1.25}
.sl .wort i{width:.55rem;height:.55rem;margin-top:.42rem;border-radius:50%;background:var(--violett);flex:none}
.sl .wort em{font-style:normal;font-weight:500;font-size:.95rem;color:var(--text2)}
.sl .z{display:grid;grid-template-columns:7.2rem 1fr;gap:.15rem 1rem;align-items:baseline}
.sl .z > span{font-size:.72rem;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--text3)}
.sl .z > p{font-size:1rem;line-height:1.4;color:var(--text)}
.sl .z.fehlt > p{color:var(--gelb)}
.sl .signal{font-size:.78rem;color:var(--text3)}
.sl .signal.alt{color:var(--gelb)}
.sl .ruhig{font-size:.82rem;color:var(--text3)}
.sl .aktion{display:flex;flex-wrap:wrap;gap:.55rem .9rem;align-items:center;padding:.6rem .85rem;border-radius:.8rem;
  background:rgba(243,210,122,.13);border:1px solid rgba(243,210,122,.4)}
.sl .aktion p{flex:1;min-width:12rem;font-size:1.06rem;font-weight:500;color:var(--text)}
.sl.arbeitet .wort i{animation:puls 1.6s ease-in-out infinite}
.sl.marcel{background:rgba(243,210,122,.1);border-bottom-color:rgba(243,210,122,.3)}
.sl.marcel .wort i{background:var(--gelb)}
.sl.fehler{background:rgba(255,143,143,.1);border-bottom-color:rgba(255,143,143,.35)}
.sl.fehler .wort i{background:var(--rot)}
.sl.fertig .wort i{background:var(--gruen)}
.sl.zugang{background:rgba(243,210,122,.07)}.sl.zugang .wort i{background:var(--gelb)}
.sl.wartet,.sl.extern,.sl.agent,.sl.unbestaetigt{background:rgba(255,255,255,.035)}
.sl.wartet .wort i,.sl.extern .wort i,.sl.agent .wort i,.sl.unbestaetigt .wort i{background:none;border:1px dashed var(--text3)}
.sl.unbestaetigt{border-bottom-style:dashed}
.sl.unbestaetigt .wort{color:var(--text2)}
@media (prefers-reduced-motion:reduce){.sl.arbeitet .wort i{animation:none}}

/* Lage wie Claudes Antwortkopf: Auftrag und Stand; Status und Frage stehen in der Statusleiste */
.lage{padding:1rem 1.5rem 1.1rem;border-bottom:1px solid rgba(255,255,255,.08);display:flex;flex-direction:column;gap:.55rem}
.lage .z{display:grid;grid-template-columns:7.2rem 1fr;gap:1rem;align-items:baseline}
.lage .z span{font-size:.75rem;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--text3)}
.lage .z p{font-size:1rem;color:var(--text2);line-height:1.4}
.lage .z b{color:var(--text);font-weight:700}
.lage .stand p{font-size:1.65rem;line-height:1.28;font-weight:500;letter-spacing:-.015em;color:var(--text2)}
.f-koerper{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain}
.f-spalte{padding:1.2rem 1.5rem}
.f-koerper::-webkit-scrollbar{width:.4rem}.f-koerper::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:.4rem}
.widgets{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,24rem),1fr));gap:1rem;align-items:start}
.widgets .w.breit{grid-column:1/-1}
details.mehr-text{margin-top:1.1rem;border-top:1px solid rgba(255,255,255,.08);padding-top:.9rem}
details.mehr-text summary{cursor:pointer;color:var(--text2);font-size:.9rem;list-style:none;display:flex;align-items:center;gap:.5rem}
details.mehr-text summary::before{content:"\203A";display:inline-block;transition:transform .2s;font-size:1.1rem}
details.mehr-text[open] summary::before{transform:rotate(90deg)}
details.mehr-text > div{margin-top:.8rem}
.leise-knopf{font-size:.85rem;color:var(--text2);padding:.45rem .9rem;border-radius:999px;border:1px solid var(--kante)}
.leise-knopf:hover{color:var(--text);border-color:var(--kante-hell)}
.archiv{position:absolute;inset:0;display:none;justify-content:center;overflow:auto;padding:0 1.6rem 1.2rem}
.archiv.an{display:flex}
.archiv .spalte{width:min(100%,70rem);display:flex;flex-direction:column;gap:.8rem;padding-top:.5rem}
.archiv h2{font-size:1.35rem;font-weight:600}
.archiv input{padding:.8rem 1.1rem;border-radius:.9rem;background:var(--glas);border:1px solid var(--kante);color:var(--text);font:inherit;font-size:1rem;outline:0}
.archiv .liste{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,30rem),1fr));gap:.8rem}
.akarte{display:flex;gap:.9rem;align-items:flex-start;text-align:left;padding:1rem 1.1rem;border-radius:1rem;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09)}
.akarte:hover{background:rgba(255,255,255,.09)}
.akarte .logo{width:2.3rem;height:2.3rem;border-radius:.7rem}.akarte .logo svg{width:1.4rem;height:1.4rem}
.akarte b{display:block;font-size:1.02rem}
.akarte span{display:block;font-size:.92rem;color:var(--text2);margin-top:.15rem}
.akarte small{display:block;font-size:.78rem;color:var(--text3);margin-top:.3rem}
.f-spalte::-webkit-scrollbar{width:.4rem}.f-spalte::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:.4rem}
.f-meta{display:grid;grid-template-columns:auto 1fr;gap:.3rem 1.2rem;font-size:.95rem;margin-bottom:1rem;padding-bottom:1rem;border-bottom:1px solid rgba(255,255,255,.07)}
.f-meta dt{color:var(--text3)}
.f-meta dd{color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.f-inhalt{font-size:1.08rem;line-height:1.65;color:var(--text)}
.f-inhalt p{margin:0 0 .85em}
.f-inhalt h3{font-size:1.15rem;font-weight:600;margin:1em 0 .45em;letter-spacing:-.01em}
.f-inhalt h3:first-child{margin-top:0}
.f-inhalt ul,.f-inhalt ol{margin:0 0 .9em 1.3em}
.f-inhalt li{margin:.2em 0}
.f-inhalt blockquote{border-left:3px solid var(--violett);padding:.2em 0 .2em 1em;color:var(--text2);margin:0 0 .9em}
.f-inhalt code{font-family:"JetBrains Mono",monospace;font-size:.88em;background:rgba(255,255,255,.08);padding:.1em .35em;border-radius:.3em}
.f-inhalt.code{font-family:"JetBrains Mono",monospace;font-size:.92rem;white-space:pre-wrap}

/* Chatverlauf */
.verlauf{display:flex;flex-direction:column;gap:.7rem;margin-bottom:1.2rem}
.blase{max-width:82%;padding:.75rem 1rem;border-radius:1.1rem 1.1rem 1.1rem .3rem;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.08);font-size:1rem;line-height:1.5}
.blase.eigen{align-self:flex-end;border-radius:1.1rem 1.1rem .3rem 1.1rem;background:rgba(127,178,255,.2);border-color:rgba(127,178,255,.3)}
.blase .wer{display:flex;justify-content:space-between;gap:1rem;font-size:.75rem;color:var(--text3);margin-bottom:.2rem}
.blase .wer b{color:var(--text2);font-weight:600}
.blase p{margin:0 0 .5em}.blase p:last-child{margin:0}

/* Widgets */
.w{border-radius:1rem;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09);padding:1rem 1.1rem}
.w h4{font-size:.78rem;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:.7rem}
.w-kennzahlen{display:grid;grid-template-columns:repeat(auto-fit,minmax(9rem,1fr));gap:.7rem}
.w-zahl{padding:.8rem .9rem;border-radius:.8rem;background:rgba(255,255,255,.05)}
.w-zahl b{display:block;font-size:1.75rem;font-weight:600;letter-spacing:-.02em;line-height:1.15}
.w-zahl span{display:block;font-size:.82rem;color:var(--text2);margin-top:.15rem}
.w-zahl small{display:block;font-size:.75rem;color:var(--text3);margin-top:.15rem}
.w table{width:100%;border-collapse:collapse;font-size:.92rem}
.w th{text-align:left;font-weight:600;color:var(--text2);padding:.45rem .6rem;border-bottom:1px solid var(--kante)}
.w td{padding:.5rem .6rem;border-bottom:1px solid rgba(255,255,255,.06);vertical-align:top}
.w tr:last-child td{border-bottom:0}
.w-check{list-style:none;display:flex;flex-direction:column;gap:.5rem;font-size:.98rem}
.w-check li{display:flex;gap:.6rem}
.w-check .k{flex:none;width:1.1rem;height:1.1rem;margin-top:.15rem;border-radius:.35rem;border:1px solid var(--kante-hell);display:grid;place-items:center;font-size:.7rem}
.w-check li.erl .k{background:rgba(127,224,176,.25);border-color:var(--gruen);color:var(--gruen)}
.w-check li.erl{color:var(--text2)}
.w-vergleich{display:grid;grid-template-columns:1fr 1fr;gap:.7rem}
.w-vergleich > div{padding:.8rem .9rem;border-radius:.8rem;background:rgba(255,255,255,.05)}
.w-vergleich b{display:block;font-size:1rem;margin-bottom:.4rem}
.w-vergleich ul{margin-left:1.1em;font-size:.92rem;color:var(--text2)}
.w-balken{display:flex;flex-direction:column;gap:.55rem;font-size:.9rem}
.w-balken .z{display:grid;grid-template-columns:minmax(6rem,30%) 1fr auto;gap:.7rem;align-items:center}
.w-balken .spur{height:.6rem;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden}
.w-balken .spur i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#3d7bff,#7fb2ff)}
.w-balken .z span:last-child{color:var(--text2);font-variant-numeric:tabular-nums}
.w-links{display:flex;flex-direction:column;gap:.55rem}
.w-links a{display:block;padding:.7rem .9rem;border-radius:.8rem;background:rgba(255,255,255,.05);color:var(--text)}
.w-links a:hover{background:rgba(255,255,255,.09);text-decoration:none}

// Statuswahrheit an genau einer Stelle: aus status, warten_auf, wartegrund, fehler und dem
// bestaetigten Signal wird eine Lage abgeleitet. Marke, Statusleiste, Sitzungsleiste und
// Schrittauszeichnung lesen alle daraus - darum koennen sie nicht auseinanderlaufen.
// Ohne frisches bestaetigtes Signal behauptet das Board keine laufende Arbeit.
const FRISCH_MIN = 15;
const WARTEN = {
  marcel: {wort:"Wartet auf dich"},
  extern: {wort:"Wartet auf einen externen Vorgang"},
  agent:  {wort:"Wartet auf einen anderen Agenten"},
  zugang: {wort:"Wartet auf einen fehlenden Zugang"},
};
const KURZ = {arbeitet:"Arbeitet", marcel:"Braucht dich", wartet:"Wartet", extern:"Wartet extern",
  agent:"Wartet auf Agent", zugang:"Zugang fehlt", fertig:"Fertig", fehler:"Fehler",
  unbestaetigt:"Nicht bestätigt"};

let KEY = null;
try { KEY = new URLSearchParams(location.hash.slice(1)).get("k") || localStorage.getItem("tonyBoardKey"); } catch(e) {
  KEY = new URLSearchParams(location.hash.slice(1)).get("k");
}
if (KEY) { try { localStorage.setItem("tonyBoardKey", KEY); } catch(e) {} }

let zustand = {fenster:[], fokus:null, ansicht:"rondell", blick:[], absprache:[], eingang:[], archiv:[]};
let vornId = null, letzterFokus = undefined, letzterStand = "", gesehenAb = 0;
// Marcels eigene Hand hat Vorrang: wer gerade blaettert oder liest, wird nicht weggerissen
let letzteHand = 0, fokusFolgen = false, lokaleAnsicht = null, letzteServerAnsicht = null;
try { gesehenAb = +localStorage.getItem("tonyAbGesehen") || 0; } catch(e) {}

const BEREICHE = [["technik","Technische Entwicklung"],["vertrieb","Vertrieb/Sales"],["organisation","Organisation"]];
const BEREICH_NAME = Object.fromEntries(BEREICHE);
let bereichWahl = null;
try { bereichWahl = localStorage.getItem("tonyBereich"); } catch(e) {}
const bereichVon = f => BEREICH_NAME[f.bereich] ? f.bereich : "organisation";

// Reihenfolge: was dich braucht vorn, laufende Arbeit hinten; innerhalb gleich bleibt die Anlage-Reihenfolge (nichts springt)
const PRIO = ["marcel","fehler","fertig","zugang","wartet","extern","agent","unbestaetigt","arbeitet"];
const prio = f => { const i = PRIO.indexOf(lage(f).art); return i < 0 ? 4 : i; };
const nachPrio = F => F.map((f,i)=>({f,i})).sort((a,b)=>prio(a.f)-prio(b.f) || a.i-b.i).map(x=>x.f);
const rondellListe = () => nachPrio(zustand.fenster.filter(f=>bereichVon(f)===bereichWahl));
function vornIndex(RF){ const i = RF.findIndex(f=>f.id===vornId); return i < 0 ? 0 : i; }
function vornFenster(){ const RF = rondellListe(); return RF[vornIndex(RF)] || null; }
function bereichStart(){
  const F = zustand.fenster, dich = F.find(f=>lage(f).art==="marcel");
  if (dich) return bereichVon(dich);
  if (BEREICH_NAME[bereichWahl]) return bereichWahl;
  return F.length ? bereichVon(nachPrio(F)[0]) : "technik";
}
// Nur neu setzen, was sich geaendert hat: kein Flackern, Scroll und Hover bleiben
function setzeHTML(el, html){ if (el._h !== html){ el.innerHTML = html; el._h = html; } }

const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const sichereUrl = u => /^https?:\/\//i.test(String(u||"")) ? esc(u) : "#";
function zeile(t){
  return t.replace(/\*\*(.+?)\*\*/g,"<b>$1</b>")
          .replace(/`([^`]+)`/g,"<code>$1</code>")
          .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>')
          .replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g,'$1<a href="$2" target="_blank" rel="noopener">$2</a>');
}
function markdown(t){
  const zeilen = esc(t).split(/\n/); let out = "", liste = null, absatz = [];
  const fl = () => { if (absatz.length){ out += "<p>"+absatz.map(zeile).join("<br>")+"</p>"; absatz = []; } };
  const fli = () => { if (liste){ out += `</${liste}>`; liste = null; } };
  for (const z of zeilen){
    let m;
    if (/^\s*$/.test(z)){ fl(); fli(); continue; }
    if ((m = z.match(/^#{1,4}\s+(.*)/))){ fl(); fli(); out += `<h3>${zeile(m[1])}</h3>`; continue; }
    if ((m = z.match(/^&gt;\s?(.*)/))){ fl(); fli(); out += `<blockquote>${zeile(m[1])}</blockquote>`; continue; }
    if ((m = z.match(/^\s*[-*•]\s+(.*)/))){ fl(); if (liste!=="ul"){ fli(); out+="<ul>"; liste="ul"; } out += `<li>${zeile(m[1])}</li>`; continue; }
    if ((m = z.match(/^\s*\d+[.)]\s+(.*)/))){ fl(); if (liste!=="ol"){ fli(); out+="<ol>"; liste="ol"; } out += `<li>${zeile(m[1])}</li>`; continue; }
    fli(); absatz.push(z);
  }
  fl(); fli();
  return out;
}

// Zeitangabe nur als Begleitung, nie als Beweis: "vor 3 Min." steht immer an einem
// Ereignis, das ausdruecklich bestaetigt wurde.
function vorMin(iso){
  const m = Math.floor((Date.now() - new Date(iso)) / 60000);
  return m < 1 ? "gerade eben" : m < 60 ? `vor ${m} Min.` : zeit(iso) + " Uhr";
}

function lage(f){
  const sig = f.bestaetigt_am && !isNaN(new Date(f.bestaetigt_am)) ? f.bestaetigt_am : null;
  const frisch = !!sig && Date.now() - new Date(sig) < FRISCH_MIN * 60000;
  const fehler = (f.fehler || "").trim();
  // Fenster von vorher haben im alten hinweis entweder die Taetigkeit oder den Wartegrund
  const ersatz = (f.hinweis || "").trim();
  let art, wort;
  if (fehler) { art = "fehler"; wort = "Angehalten durch einen Fehler"; }
  else if (f.status === "fertig") { art = "fertig"; wort = "Fertig"; }
  else if (f.status === "braucht_dich" || f.status === "wartet") {
    art = f.status === "braucht_dich" ? "marcel" : WARTEN[f.warten_auf] ? f.warten_auf : "wartet";
    wort = WARTEN[art] ? WARTEN[art].wort : "Wartet";
  }
  else if (frisch) { art = "arbeitet"; wort = "Arbeitet"; }
  else { art = "unbestaetigt"; wort = "Status nicht aktuell bestätigt"; }
  const wartet = art === "marcel" || art === "wartet" || art === "extern" || art === "agent" || art === "zugang";
  const taetigkeit = (f.taetigkeit || "").trim() || (wartet || fehler ? "" : ersatz);
  const grund = (f.wartegrund || "").trim() || (wartet || fehler ? ersatz : "");
  let signal, signalAlt = false;
  if (sig){
    signal = (art === "fertig" ? "Abschluss gemeldet " : "Zuletzt bestätigt ") + vorMin(sig);
    signalAlt = !frisch && art !== "fertig";
  } else {
    signal = "Kein bestätigtes Signal" + (f.geaendert ? " · Karte geändert " + vorMin(f.geaendert) : "");
    signalAlt = art !== "fertig";
  }
  const frage = art !== "marcel" ? ""
    : (f.von_dir || "").trim()
      || (f.freigabe === "angefragt" ? "Entwurf gegenlesen: freigeben oder ändern?" : grund)
      || "Frage fehlt – frag Tony, was er von dir braucht.";
  return {art, wort, kurz: KURZ[art] || art, aktiv: art === "arbeitet", wartet, fehler, grund, taetigkeit, frage,
          zustaendig: (f.zustaendig || "").trim(), naechste: (f.naechste_aktion || "").trim(),
          signal, signalAlt, signalKurz: sig ? (frisch ? "bestätigt " : "zuletzt bestätigt ") + vorMin(sig) : "nicht bestätigt"};
}

// Die Leiste in der Karte: Taetigkeit, Zustaendiger, Wartegrund, naechste Aktion, letztes
// bestaetigtes Signal - und entweder eine konkrete Aktion fuer Marcel oder ausdruecklich keine.
function statusleisteHTML(f, L){
  const z = [];
  if (L.fehler) z.push(["Fehler", L.fehler, ""]);
  if (L.wartet && L.art !== "marcel") z.push(["Wartet auf", L.grund || "Grund nicht genannt – frag Tony", L.grund ? "" : "fehlt"]);
  if (L.taetigkeit) z.push([L.art === "fertig" ? "Getan" : "Tätigkeit", L.taetigkeit, ""]);
  if (L.naechste) z.push(["Als nächstes", L.naechste, ""]);
  const aktion = L.art === "marcel"
    ? `<div class="aktion"><p>${zeile(esc(L.frage))}</p>${f.freigabe === "angefragt"
        ? `<button class="glasknopf" data-ab="${esc(f.id)}">Ändern …</button><button class="glasknopf ja" data-ja="${esc(f.id)}">Freigeben</button>`
        : ""}</div>`
    : `<div class="ruhig">Keine Aktion von dir nötig.</div>`;
  return `<div class="sl ${L.art}">
      <div class="wort"><i></i><span>${esc(L.wort)}${L.zustaendig && L.art !== "marcel" ? ` <em>· ${esc(L.zustaendig)}</em>` : ""}</span></div>
      ${z.map(([k,v,c])=>`<div class="z ${c}"><span>${k}</span><p>${zeile(esc(v))}</p></div>`).join("")}
      ${aktion}
      <div class="signal ${L.signalAlt?"alt":""}">${esc(L.signal)}</div>
    </div>`;
}

// Nur bestaetigt laufende Arbeit zeigt einen laufenden Schritt; Warten und Fehler zeigen
// denselben Schritt angehalten, und ein fertiges Fenster hebt keinen Schritt mehr hervor.
function schritteHTML(f, L){
  const S = f.schritte || [];
  const akt = L.art === "fertig" ? -1 : S.findIndex(s => s.aktuell && !s.erledigt);
  return S.map((s,i)=>{
    const k = s.erledigt ? "erl" : i === akt ? (L.aktiv ? "akt" : "halt") : "";
    const titel = i === akt && !L.aktiv ? ` title="Hier angehalten: ${esc(L.wort)}"` : "";
    return `<span class="schritt ${k}"${titel}><span class="k">${s.erledigt?"✓":""}</span>${esc(s.text)}</span>`;
  }).join("");
}

const fensterKlassen = L => `fenster ${L.art==="marcel"?"braucht":""} ${L.art==="fehler"?"fehlerhaft":""} ${L.aktiv?"aktiv":""}`;

function widget(w){
  const d = w.daten || {}, t = w.titel ? `<h4>${esc(w.titel)}</h4>` : "";
  try {
    switch (w.typ){
      case "kennzahlen": return `<div class="w">${t}<div class="w-kennzahlen">${(d.werte||[]).map(k=>`<div class="w-zahl"><b>${esc(k.wert)}</b><span>${esc(k.label)}</span>${k.hinweis?`<small>${esc(k.hinweis)}</small>`:""}</div>`).join("")}</div></div>`;
      case "tabelle": return `<div class="w">${t}<table><thead><tr>${(d.spalten||[]).map(s=>`<th>${esc(s)}</th>`).join("")}</tr></thead><tbody>${(d.zeilen||[]).map(r=>`<tr>${(r||[]).map(c=>`<td>${zeile(esc(c))}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
      case "checkliste": return `<div class="w">${t}<ul class="w-check">${(d.punkte||[]).map(p=>`<li class="${p.erledigt?"erl":""}"><span class="k">${p.erledigt?"✓":""}</span>${esc(p.text)}</li>`).join("")}</ul></div>`;
      case "vergleich": { const s = x => x ? `<div><b>${esc(x.titel)}</b><ul>${(x.punkte||[]).map(p=>`<li>${esc(p)}</li>`).join("")}</ul></div>` : "<div></div>";
        return `<div class="w">${t}<div class="w-vergleich">${s(d.links)}${s(d.rechts)}</div></div>`; }
      case "balken": { const max = Math.max(1, ...(d.werte||[]).map(v=>+v.wert||0));
        return `<div class="w">${t}<div class="w-balken">${(d.werte||[]).map(v=>`<div class="z"><span>${esc(v.label)}</span><span class="spur"><i style="width:${Math.max(2,(+v.wert||0)/max*100)}%"></i></span><span>${esc(v.wert)}${d.einheit?" "+esc(d.einheit):""}</span></div>`).join("")}</div></div>`; }
      case "links": return `<div class="w">${t}<div class="w-links">${(d.eintraege||[]).map(l=>`<a href="${sichereUrl(l.url)}" target="_blank" rel="noopener"><b>${esc(l.titel||l.url)}</b><small>${esc(l.url)}</small>${l.beschreibung?`<span>${esc(l.beschreibung)}</span>`:""}</a>`).join("")}</div></div>`;
      case "zitat": return `<div class="w">${t}<div class="w-zitat">„${esc(d.text)}“${d.quelle?`<small>${esc(d.quelle)}</small>`:""}</div></div>`;
      case "bild": return `<div class="w">${t}<img src="${sichereUrl(d.url)}" alt="${esc(d.alt)}"></div>`;
      case "mockup": return `<div class="w">${t}<iframe sandbox="" referrerpolicy="no-referrer" srcdoc="${esc(d.html||"")}"></iframe></div>`;
    }
  } catch(e) {}
  return "";
}

function verlaufHTML(v){
  if (!v || !v.length) return "";
  return `<div class="verlauf">${v.map(n=>`<div class="blase ${n.eigen?"eigen":""}"><div class="wer"><b>${esc(n.wer)}</b>${n.zeit?`<span>${esc(n.zeit)}</span>`:""}</div>${markdown(n.text)}</div>`).join("")}</div>`;
}

/* Einstieg: bevor ein Mitarbeiter etwas fragt, zeigt er Thema, Ablauf, Zahlen, Stand und Empfehlung */
function einstiegHTML(f){
  const e = f.einstieg;
  // Der Einstieg gehoert zur offenen Frage; arbeitet die Sitzung wieder, ist er ueberholt
  if (!e || typeof e !== "object" || f.status !== "braucht_dich") return "";
  const ini = String(e.bereich||"").split(/\s+/).filter(w=>w && w!=="und").map(w=>w[0]).join("").slice(0,2).toUpperCase();
  const kette = (e.kette||[]).map((k,i,a)=>`<div class="e-schritt ${i===a.length-1?"letzter":""}">${esc(k)}</div>${i<a.length-1?'<span class="e-pfeil">›</span>':""}`).join("");
  const zahlen = (e.zahlen||[]).map(z=>`<div class="e-zahl"><span>${esc(z.text)}</span><b>${esc(z.wert)}</b></div>`).join("");
  const st = e.stand||{};
  const stufe = (k,v) => `<span class="e-stufe ${v?"ok":""}">${esc(k)}${v===undefined||v===null?" –":""}</span>`;
  return `<div class="einstieg">
    <div class="e-kopf"><span class="e-avatar">${esc(ini)}</span><div><small>Mitarbeiter ${esc(e.bereich||f.mitarbeiter||"")}</small><b>${esc(e.thema||f.titel)}</b></div></div>
    ${kette?`<small class="e-label">Was los war</small><div class="e-kette">${kette}</div>`:""}
    ${zahlen?`<div class="e-zahlen">${zahlen}</div>`:""}
    <div class="e-stand">${stufe("Code",st.code)}${stufe("staging",st.staging)}${stufe("prod",st.prod)}<span class="e-stufe">du bestätigst</span></div>
    ${e.empfehlung?`<div class="e-empf"><small>So würde ich es machen</small><b>${esc(e.empfehlung)}</b>${e.risiko?`<p><i></i>${esc(e.risiko)}</p>`:""}</div>`:""}
    ${f.von_dir?`<small class="e-label">Von dir</small><p class="e-frage">${esc(f.von_dir)}</p>`:""}
  </div>`;
}

function fensterHTML(f){
  const L = lage(f);
  const kopf = f.kopf && Object.keys(f.kopf).length
    ? `<dl class="f-meta">${Object.entries(f.kopf).map(([k,v])=>`<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("")}</dl>` : "";
  const text = f.inhalt ? `<div class="f-inhalt ${f.art==="code"?"code":""}">${f.art==="code"?esc(f.inhalt):markdown(f.inhalt)}</div>` : "";
  const verlauf = verlaufHTML(f.verlauf);
  const ws = (f.widgets||[]).map(w => widget(w).replace('<div class="w">', `<div class="w${["tabelle","mockup","vergleich"].includes(w.typ)?" breit":""}">`)).join("");
  // Widgets zuerst; Fliesstext nur eingeklappt, ausser bei Mails/Chats oder wenn es nichts anderes gibt
  const textOffen = f.art === "mail" || f.art === "chat" || !ws;
  const details = (kopf || text || verlauf)
    ? (textOffen ? `${kopf}${f.art==="chat"?verlauf+text:text+verlauf}` : `<details class="mehr-text"><summary>Details lesen</summary><div>${kopf}${text}${verlauf}</div></details>`)
    : "";
  const schritte = schritteHTML(f, L);
  // Die Freigabeknoepfe stehen in der Statusleiste bei der Frage, nicht unten am Rand
  let freigabe = "";
  if (f.freigabe === "freigegeben") freigabe = `<span class="marke-frei">Freigegeben</span>`;
  else if (f.freigabe === "abgelehnt") freigabe = `<span class="marke-ab">Änderung gewünscht</span>`;
  const archiv = `<button class="leise-knopf" data-archiv="${esc(f.id)}" style="${freigabe?"":"margin-left:auto"}">Archivieren</button>`;
  return `<div class="f-kopf"><div class="logo">${LOGOS[f.app]||LOGOS.notiz}</div>
      <div class="f-titel"><small>${esc(f.app)}</small><b>${esc(f.titel)}</b></div>
      <div class="status ${L.art}"><i></i>${esc(L.kurz)}</div></div>
    <div class="f-koerper">
    ${einstiegHTML(f)}
    ${statusleisteHTML(f, L)}
    ${(f.auftrag||f.kernaussage)?`<div class="lage">
      ${f.auftrag?`<div class="z"><span>Auftrag</span><p>${zeile(esc(f.auftrag))}</p></div>`:""}
      ${f.kernaussage?`<div class="z stand"><span>Stand</span><p>${zeile(esc(f.kernaussage))}${L.aktiv?'<span class="laeuft" aria-label="wird bearbeitet"><i></i><i></i><i></i></span>':""}</p></div>`:""}
    </div>`:""}
    <div class="f-spalte">
      ${ws?`<div class="widgets">${ws}</div>`:""}
      ${details || (ws?"":'<div class="f-inhalt" style="color:var(--text3)">Tony bereitet den Inhalt vor …</div>')}
    </div></div>
    <div class="f-fuss">${schritte}${freigabe}${archiv}</div>`;
}

function archivZeichnen(){
  const q = (document.getElementById("asuche").value||"").toLowerCase().trim();
  const liste = (zustand.archiv||[]).filter(a => !q || (a.titel+" "+(a.kernaussage||"")).toLowerCase().includes(q));
  setzeHTML(document.getElementById("aliste"), liste.length
    ? liste.map(a=>`<button class="akarte" data-zurueck="${esc(a.id)}"><div class="logo">${LOGOS[a.app]||LOGOS.notiz}</div><div><b>${esc(a.titel)}</b>${a.kernaussage?`<span>${zeile(esc(a.kernaussage))}</span>`:""}<small>${new Date(a.geaendert).toLocaleString("de-DE",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"})} · zurück aufs Board</small></div></button>`).join("")
    : `<div style="color:var(--text3);padding:2rem 0">${q?"Nichts gefunden.":"Noch nichts archiviert."}</div>`);
}

/* Bleibt im Blick ist Wiedervorlage: jeder Punkt zeigt den offenen Grund, die Karte dazu, den
   naechsten Prueftermin und was die letzte Pruefung ergeben hat. Faelliges steht oben. */
const HEUTE = () => new Date().toLocaleDateString("sv-SE");
function blickTermin(b){
  if (!b.nachfassen_am) return {text:"Prüftermin fehlt", klasse:"offen"};
  const tage = Math.round((Date.parse(HEUTE()) - Date.parse(b.nachfassen_am)) / 864e5);
  const datum = new Date(b.nachfassen_am).toLocaleDateString("de-DE",{day:"2-digit",month:"2-digit"});
  if (tage > 0) return {text:`überfällig seit ${tage} ${tage===1?"Tag":"Tagen"} (${datum})`, klasse:"faellig"};
  if (tage === 0) return {text:"heute fällig", klasse:"faellig"};
  return {text:`Prüfung am ${datum}`, klasse:""};
}
const blickSortiert = () => (zustand.blick || []).slice().sort((a,b)=>{
  const r = x => x.nachfassen_am ? (x.nachfassen_am <= HEUTE() ? 0 : 2) : 1;  // fällig, ohne Termin, später
  return r(a) - r(b) || String(a.nachfassen_am||"").localeCompare(String(b.nachfassen_am||""));
});
const blickFaellig = () => (zustand.blick || []).filter(b=>b.nachfassen_am && b.nachfassen_am <= HEUTE()).length;
function blickHTML(){
  const B = blickSortiert();
  if (!B.length) return `<li class="leer">Nichts offen.</li>`;
  return B.map(b=>{
    const t = blickTermin(b);
    const karte = b.karte_titel || (b.fenster_id ? b.fenster_id : "");
    const offen = b.fenster_id && finde(b.fenster_id);
    const geprueft = b.geprueft_am
      ? `geprüft ${new Date(b.geprueft_am).toLocaleDateString("de-DE",{day:"2-digit",month:"2-digit"})}${b.pruefstand?": "+b.pruefstand:""}`
      : "noch nicht geprüft";
    const meta = [b.wer, karte ? "Karte: " + karte : "ohne Karte", geprueft].filter(Boolean).join(" · ");
    return `<li class="${t.klasse}"><button class="box" data-blick="${esc(b.id)}" title="Erledigt abhaken" aria-label="Erledigt abhaken"></button><span class="b-text ${offen?"link":""}" ${offen?`data-zeige="${esc(b.fenster_id)}"`:""}>${esc(b.text)}<small class="termin ${t.klasse}">${esc(t.text)}</small><small>${esc(meta)}</small></span></li>`;
  }).join("");
}

function bereicheZeichnen(){
  setzeHTML(document.getElementById("bereiche"), BEREICHE.map(([k,name])=>{
    const G = zustand.fenster.filter(f=>bereichVon(f)===k), dich = G.some(f=>lage(f).art==="marcel");
    return `<button data-bereich="${k}" class="${k===bereichWahl?"an":""}">${dich?'<i class="dich" title="braucht dich"></i>':""}${name}<span class="n">${G.length}</span></button>`;
  }).join(""));
}

function rondellZeichnen(){
  const r = document.getElementById("rondell"), RF = rondellListe();
  const ids = new Set(RF.map(f=>f.id));
  r.querySelectorAll(":scope > .fenster").forEach(el=>{ if (!ids.has(el.dataset.id)) el.remove(); });
  const leer = r.querySelector(":scope > .leerstand");
  if (!RF.length){
    const html = `<div><b>In ${esc(BEREICH_NAME[bereichWahl])} läuft gerade nichts.</b>${zustand.fenster.length ? "Die anderen Bereiche oben haben offene Fenster." : "Sobald Tony an etwas arbeitet, erscheint es hier."}</div>`;
    if (leer) setzeHTML(leer, html);
    else { const d = document.createElement("div"); d.className = "leerstand"; setzeHTML(d, html); r.appendChild(d); }
    return;
  }
  if (leer) leer.remove();
  RF.forEach((f,i)=>{
    let el = [...r.children].find(c=>c.dataset.id===f.id);
    if (!el){ el = document.createElement("section"); el.dataset.id = f.id; el.dataset.neu = "1"; r.appendChild(el); }
    el.className = fensterKlassen(lage(f));
    el.dataset.i = i;
    const html = fensterHTML(f);
    if (el._h !== html){
      const k = el.querySelector(".f-koerper"), top = k ? k.scrollTop : 0, offen = !!el.querySelector("details.mehr-text[open]");
      el.innerHTML = html; el._h = html;
      if (offen) el.querySelector("details.mehr-text")?.setAttribute("open","");
      if (top) el.querySelector(".f-koerper").scrollTop = top;
    }
  });
}

function zeit(iso){ try { return new Date(iso).toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"}); } catch(e){ return ""; } }

function absprachZeichnen(){
  const ab = (zustand.absprache||[]).map(m=>({wer:m.von, text:m.text, t:m.erstellt, id:m.id}));
  const mein = (zustand.eingang||[]).filter(e=>e.art==="nachricht").map(e=>({wer:"marcel", text:e.text, t:e.erstellt}));
  const alle = ab.concat(mein).sort((a,b)=>a.t<b.t?-1:1);
  const name = {tony:"Tony", claude:"Claude", marcel:"Du an Tony"};
  setzeHTML(document.getElementById("abspalte"),
    `<h2>Tony ⇄ Claude</h2><div class="unter">Was die beiden untereinander absprechen. Claude schaut jede Minute nach.</div>` +
    (alle.length ? alle.map(n=>`<div class="blase ${n.wer}"><div class="wer"><b>${name[n.wer]}</b><span>${zeit(n.t)}</span></div>${markdown(n.text)}</div>`).join("")
                 : `<div class="leerstand" style="position:static;padding:4rem 0"><div><b>Noch keine Absprache.</b>Sobald Tony Claude etwas übergibt, steht es hier.</div></div>`));
  const neu = ab.filter(m=>m.id > gesehenAb).length;
  const z = document.getElementById("abzahl");
  if (zustand.ansicht === "absprache"){ const max = Math.max(0,...ab.map(m=>m.id)); if (max > gesehenAb){ gesehenAb = max; try{localStorage.setItem("tonyAbGesehen",max);}catch(e){} } z.hidden = true; }
  else { z.hidden = !neu; z.textContent = neu; }
}

function zeichnen(){
  const F = zustand.fenster, a = zustand.ansicht;
  if (!BEREICH_NAME[bereichWahl]) bereichWahl = bereichStart();
  setzeHTML(document.getElementById("todos"), blickHTML());
  const faellig = blickFaellig();
  setzeHTML(document.getElementById("hblick"), `Bleibt im Blick${faellig ? ` · <b class="f">${faellig} fällig</b>` : ""}`);
  document.querySelectorAll("#umschalter button").forEach(b=>b.classList.toggle("an", b.dataset.a===a));
  document.getElementById("rondell").classList.toggle("aus", a!=="rondell");
  document.getElementById("mehr").classList.toggle("an", a==="mehrfenster");
  document.getElementById("karte").classList.toggle("an", a==="karte");
  document.body.classList.toggle("v-karte", a==="karte");
  document.getElementById("absprache").classList.toggle("an", a==="absprache");
  document.body.classList.toggle("v-mehrfenster", a==="mehrfenster");
  document.body.classList.toggle("v-rondell", a==="rondell");
  document.getElementById("archiv").classList.toggle("an", a==="archiv");
  archivZeichnen();
  absprachZeichnen();
  bereicheZeichnen();
  rondellZeichnen();
  leisteZeichnen();
  if (a === "karte") kartenZeichnen();
  if (!F.length){
    setzeHTML(document.getElementById("detail"), `<div class="leerstand" style="position:static;padding:4rem 0"><div><b>Keine offene Sitzung.</b>Sobald Tony an etwas arbeitet, steht es links.</div></div>`);
    gezeigt = null; gezeigtHTML = "";
  } else detailZeichnen();
  drehen();
}

/* Karte (Vorbild Voicetree): eine Flaeche zum Verschieben und Zoomen. Tony als Hauptmanager in der Mitte,
   darum die Workspaces, die Abteilungen (Mitarbeiter) und ihre Aufgaben. Aufgaben, die Marcel brauchen,
   zeigen ihre Frage als kleine Karte direkt am Knoten; ein Klick oeffnet die ganze Karte am Knoten. */
let kartenWahl = null, kartenWs = "Alle";
const kOffen = new Set();                 // ganz geoeffnete Karten (ids)
const kView = { x: 0, y: 0, s: 1, init: false };
let kRahmen = null;             // Rahmen um den tatsaechlichen Inhalt, zum Einpassen
const KW = 2600, KH = 1700;               // Weltgroesse
const K_FARBE = {braucht_dich:"#f0c96e", arbeitet:"#8fb2ff", wartet:"#a3abc0", fertig:"#7fd6a8"};
const K_WS_FARBE = ["#5fd4c4", "#a78bfa", "#f2a65a", "#7fb2ff", "#f07fa8"];
const kWs = f => f.workspace || (String(f.id).startsWith("cc-") ? "Sitzungen" : "Büro (Tony)");
const kAbt = f => f.mitarbeiter || (String(f.id).startsWith("cc-") ? "Noch ohne Abteilung" : (BEREICH_NAME[f.bereich] || "Allgemein"));
const kKurz = (t,n) => { t = String(t||"").replace(/\*\*/g,""); return t.length > n ? t.slice(0,n-1)+"…" : t; };
const kIni = t => String(t).split(/\s+/).filter(w => w && w !== "und" && w !== "·").map(w => w[0]).join("").slice(0,2).toUpperCase();

function kAnwenden(){
  const w = document.querySelector("#kmapbox .k-welt"); if (!w) return;
  w.style.transform = `translate(${kView.x}px,${kView.y}px) scale(${kView.s})`;
  const m = document.getElementById("kmapbox"), r = document.querySelector("#kmapbox .k-mini-rahmen");
  if (m && r){
    const b = m.getBoundingClientRect(), f = 180 / KW;
    r.setAttribute("x", -kView.x / kView.s * f); r.setAttribute("y", -kView.y / kView.s * f);
    r.setAttribute("width", b.width / kView.s * f); r.setAttribute("height", b.height / kView.s * f);
  }
}
function kEinpassen(){
  const b = document.getElementById("kmapbox").getBoundingClientRect();
  const r = kRahmen || {x0: 0, y0: 0, x1: KW, y1: KH}, oben = 70, rand = 30;
  const bw = r.x1 - r.x0, bh = r.y1 - r.y0;
  kView.s = Math.min(1.1, Math.min((b.width - 2*rand) / bw, (b.height - oben - rand) / bh));
  kView.x = (b.width - bw * kView.s) / 2 - r.x0 * kView.s;
  kView.y = oben + (b.height - oben - rand - bh * kView.s) / 2 - r.y0 * kView.s;
  kAnwenden();
}

function kartenZeichnen(){
  const alle = zustand.fenster;
  const wsListe = [...new Set(alle.map(kWs))].sort();
  if (kartenWs !== "Alle" && !wsListe.includes(kartenWs)) kartenWs = "Alle";
  const wsFarbe = w => K_WS_FARBE[Math.max(0, wsListe.indexOf(w)) % K_WS_FARBE.length];
  const offenIn = w => alle.filter(f => (w==="Alle" || kWs(f)===w) && f.status==="braucht_dich").length;
  setzeHTML(document.getElementById("kfilter"), ["Alle", ...wsListe].map(w =>
    `<button data-ws="${esc(w)}" class="${w===kartenWs?"an":""}">${w!=="Alle"?`<span class="k-punkt" style="background:${wsFarbe(w)}"></span>`:""}${esc(w)}${offenIn(w)?`<i>${offenIn(w)}</i>`:""}</button>`).join("")
    + `<button data-kfit class="k-fit">Einpassen</button>`);
  const box = document.getElementById("kmapbox");
  if (!box.querySelector(".k-welt")){
    box.innerHTML = `<div class="k-welt"><svg class="k-svg" width="${KW}" height="${KH}" viewBox="0 0 ${KW} ${KH}"></svg><div class="k-karten"></div></div>
      <svg class="k-mini" width="180" height="${180*KH/KW}" viewBox="0 0 180 ${180*KH/KW}"><g class="k-mini-inhalt"></g><rect class="k-mini-rahmen" fill="rgba(255,255,255,.06)" stroke="rgba(255,255,255,.5)"/></svg>`;
  }
  const F = alle.filter(f => kartenWs==="Alle" || kWs(f)===kartenWs);
  const baum = [...new Set(F.map(kWs))].map(w => {
    const fw = F.filter(f => kWs(f)===w);
    return { w, abt: [...new Set(fw.map(kAbt))].map(a => ({ a, aufg: fw.filter(f => kAbt(f)===a) })) };
  });
  const cx = KW/2, cy = KH/2, R1 = baum.length > 1 ? 270 : 0, R2 = 540, R3 = 120, SY = .72;
  const gesamt = Math.max(1, F.length);
  const kanten = [], knoten = [], beschr = [], karten = [], mini = [];
  const kurve = (x1,y1,x2,y2,farbe,breite,deckung) => {
    const mx = (x1+x2)/2, my = (y1+y2)/2, dx = x2-x1, dy = y2-y1;
    return `<path d="M${x1} ${y1} Q${mx - dy*.12} ${my + dx*.12} ${x2} ${y2}" fill="none" stroke="${farbe}" stroke-opacity="${deckung}" stroke-width="${breite}" stroke-linecap="round"/>`;
  };
  const etikett = (x, y, text, gr, farbe, gew = 600) => {
    const w = text.length * gr * .57 + 26, h = gr + 14;
    return `<g><rect x="${x - w/2}" y="${y - h/2}" width="${w}" height="${h}" rx="${h/2}" fill="rgba(7,12,26,.82)" stroke="rgba(255,255,255,.14)"/>
      <text x="${x}" y="${y + gr*.36}" font-size="${gr}" font-weight="${gew}" fill="${farbe}" text-anchor="middle">${esc(text)}</text></g>`;
  };
  const belegt = [], rahmen = {x0: cx - 120, y0: cy - 120, x1: cx + 120, y1: cy + 150};
  const merke = (x0, y0, x1, y1) => { rahmen.x0 = Math.min(rahmen.x0, x0); rahmen.y0 = Math.min(rahmen.y0, y0); rahmen.x1 = Math.max(rahmen.x1, x1); rahmen.y1 = Math.max(rahmen.y1, y1); };
  const platz = (x, y, w, h) => {      // schiebt eine Karte nach unten, bis sie keine andere ueberdeckt
    let yy = y;
    for (let i = 0; i < 40 && belegt.some(r => x < r.x1 && x + w > r.x0 && yy < r.y1 && yy + h > r.y0); i++) yy += 24;
    belegt.push({x0: x, y0: yy, x1: x + w + 8, y1: yy + h + 8}); merke(x, yy, x + w, yy + h);
    return yy;
  };
  let winkel = -Math.PI/2;
  for (const t of baum){
    const farbe = wsFarbe(t.w);
    const n = t.abt.reduce((s,x)=>s+x.aufg.length,0);
    const sektor = (n/gesamt) * Math.PI*2, wm = winkel + sektor/2;
    const wx = cx + Math.cos(wm)*R1, wy = cy + Math.sin(wm)*R1*SY;
    if (R1) kanten.push(kurve(cx, cy, wx, wy, farbe, 3, .6));
    let aw = winkel;
    for (const ab of t.abt){
      const as = (ab.aufg.length/n) * sektor, am = aw + as/2;
      const ax = cx + Math.cos(am)*R2, ay = cy + Math.sin(am)*R2*SY;
      kanten.push(kurve(wx, wy, ax, ay, farbe, 2.2, .45));
      const m = ab.aufg.length, fan = Math.min(2.3, .6*m);
      ab.aufg.forEach((f,i) => {
        const tw = am + (m===1 ? 0 : -fan/2 + i/(m-1)*fan);
        const r = R3 + (i%2)*46;
        const tx = ax + Math.cos(tw)*r, ty = ay + Math.sin(tw)*r*.85;
        const dich = f.status === "braucht_dich", fb = K_FARBE[f.status] || "#6b7280", rad = dich ? 13 : 10;
        kanten.push(`<line x1="${ax}" y1="${ay}" x2="${tx}" y2="${ty}" stroke="${fb}" stroke-opacity=".35" stroke-width="1.6"/>`);
        knoten.push(`<g class="k-aufg" data-k="${esc(f.id)}">
          <circle cx="${tx}" cy="${ty}" r="${rad + 16}" fill="url(#kglow)" style="color:${fb}" opacity="${dich?.95:.5}"/>
          ${kOffen.has(f.id)||f.id===kartenWahl?`<circle cx="${tx}" cy="${ty}" r="${rad + 7}" fill="none" stroke="#fff" stroke-width="2.5"/>`:""}
          <circle cx="${tx}" cy="${ty}" r="${rad}" fill="${fb}"/><circle cx="${tx - rad*.32}" cy="${ty - rad*.36}" r="${rad*.36}" fill="#fff" opacity=".55"/>
          <title>${esc(kKurz(f.titel, 90))} · ${esc(lage(f).kurz)}</title></g>`);
        merke(tx - 30, ty - 30, tx + 30, ty + 30);
        mini.push(`<circle cx="${tx*180/KW}" cy="${ty*180/KW}" r="${dich?2.4:1.6}" fill="${fb}"/>`);
        const rechts = Math.cos(tw) >= 0;
        if (kOffen.has(f.id)){
          const kx = rechts ? tx + 34 : tx - 34 - 520, ky = platz(kx, ty - 60, 520, 560);
          karten.push(`<div class="k-voll" style="left:${kx}px;top:${ky}px" data-kid="${esc(f.id)}"><button class="k-zu" data-kzu="${esc(f.id)}" aria-label="Schließen">×</button>${kVollHTML(f, ab.a, farbe)}</div>`);
        } else if (dich){
          const kx = rechts ? tx + 30 : tx - 30 - 340, ky = platz(kx, ty - 56, 340, 175);
          karten.push(`<div class="k-frage" style="left:${kx}px;top:${ky}px" data-k="${esc(f.id)}">
            <div class="kf-wer"><span class="kf-av" style="--c:${farbe}">${esc(kIni(ab.a))}</span>${esc(kKurz(ab.a, 26))}</div>
            <div class="kf-titel">${esc(kKurz(f.titel, 46))}</div>
            <div class="kf-q">${esc(kKurz(f.von_dir || f.kernaussage || "Braucht dich", 120))}</div>
            <div class="kf-mehr">Öffnen ›</div></div>`);
        } else {
          beschr.push(`<text x="${tx + (rechts?20:-20)}" y="${ty + 5}" font-size="14" fill="rgba(255,255,255,.7)" text-anchor="${rechts?"start":"end"}">${esc(kKurz(f.titel, 34))}</text>`);
        }
      });
      const offen = ab.aufg.filter(f=>f.status==="braucht_dich").length, kr = 26 + Math.min(14, m*3);
      knoten.push(`<g class="k-abt" data-abt="${esc(ab.a)}"><circle cx="${ax}" cy="${ay}" r="${kr + 26}" fill="url(#kglow)" style="color:${farbe}" opacity=".45"/>
        <circle cx="${ax}" cy="${ay}" r="${kr}" fill="url(#kkugel)" stroke="${farbe}" stroke-opacity=".8" stroke-width="2"/>
        <ellipse cx="${ax - kr*.22}" cy="${ay - kr*.45}" rx="${kr*.5}" ry="${kr*.26}" fill="#fff" opacity=".22"/>
        <text x="${ax}" y="${ay + 6}" font-size="${kr*.55}" font-weight="700" fill="${farbe}" text-anchor="middle">${esc(kIni(ab.a))}</text>
        <title>${esc(ab.a)}: ${m} Aufgaben, ${offen} brauchen dich</title></g>`);
      if (offen) knoten.push(`<circle cx="${ax+kr*.78}" cy="${ay-kr*.78}" r="14" fill="#f0c96e"/><text x="${ax+kr*.78}" y="${ay-kr*.78+5}" font-size="15" font-weight="700" fill="#2a1f05" text-anchor="middle">${offen}</text>`);
      beschr.push(etikett(ax, ay + kr + 28, `${kKurz(ab.a, 28)} · ${m}`, 17, "#fff"));
      merke(ax - 160, ay - 60, ax + 160, ay + 90);
      mini.push(`<circle cx="${ax*180/KW}" cy="${ay*180/KW}" r="3.5" fill="${farbe}"/>`);
      aw += as;
    }
    if (R1){
      knoten.push(`<g class="k-ws" data-ws="${esc(t.w)}"><circle cx="${wx}" cy="${wy}" r="80" fill="url(#kglow)" style="color:${farbe}" opacity=".6"/>
        <circle cx="${wx}" cy="${wy}" r="40" fill="url(#kkugel)" stroke="${farbe}" stroke-width="2.5"/>
        <ellipse cx="${wx-10}" cy="${wy-17}" rx="18" ry="9" fill="#fff" opacity=".25"/></g>`);
      beschr.push(etikett(wx, wy + 68, t.w, 20, farbe, 700));
    }
    winkel += sektor;
  }
  kRahmen = rahmen;
  const offenAlle = F.filter(f=>f.status==="braucht_dich").length;
  const bahnen = [R1, R2].filter(Boolean).map(r => `<ellipse cx="${cx}" cy="${cy}" rx="${r}" ry="${r*SY}" fill="none" stroke="rgba(255,255,255,.07)" stroke-width="1.5" stroke-dasharray="3 9"/>`).join("");
  setzeHTML(document.querySelector("#kmapbox .k-svg"), `
    <defs>
      <radialGradient id="kkugel" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#5a6074"/><stop offset=".45" stop-color="#151a28"/><stop offset="1" stop-color="#05070d"/></radialGradient>
      <radialGradient id="kweiss" cx=".38" cy=".32" r=".85"><stop offset="0" stop-color="#fff"/><stop offset=".55" stop-color="#eceef4"/><stop offset="1" stop-color="#b9bdca"/></radialGradient>
      <radialGradient id="kglow"><stop offset="0" stop-color="currentColor" stop-opacity=".7"/><stop offset="1" stop-color="currentColor" stop-opacity="0"/></radialGradient>
      <radialGradient id="khalo"><stop offset="0" stop-color="#9fc2ff" stop-opacity=".3"/><stop offset="1" stop-color="#9fc2ff" stop-opacity="0"/></radialGradient>
      <pattern id="kraster" width="34" height="34" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1.2" fill="rgba(255,255,255,.06)"/></pattern>
    </defs>
    <rect width="${KW}" height="${KH}" fill="url(#kraster)"/>
    ${bahnen}${kanten.join("")}${knoten.join("")}
    <circle cx="${cx}" cy="${cy}" r="210" fill="url(#khalo)"/>
    <circle cx="${cx}" cy="${cy}" r="70" fill="url(#kweiss)"/>
    <ellipse cx="${cx-18}" cy="${cy-28}" rx="30" ry="14" fill="#fff" opacity=".75"/>
    <text x="${cx}" y="${cy+4}" font-size="26" font-weight="700" fill="#0a0a0b" text-anchor="middle">Tony</text>
    <text x="${cx}" y="${cy+27}" font-size="14" fill="#4a4d58" text-anchor="middle">Hauptmanager</text>
    ${beschr.join("")}
    ${offenAlle?etikett(cx, cy + 108, `${offenAlle} brauchen dich`, 19, "#f6dca0"):""}`);
  setzeHTML(document.querySelector("#kmapbox .k-karten"), karten.join(""));
  setzeHTML(document.querySelector("#kmapbox .k-mini-inhalt"), mini.join("") + `<circle cx="${cx*180/KW}" cy="${cy*180/KW}" r="5" fill="#fff"/>`);
  if (!kView.init && box.getBoundingClientRect().width > 0){ kView.init = true; kEinpassen(); } else kAnwenden();
}

// Die Karte am Knoten: Einstieg, Stand und Frage, ohne das Innenleben der grossen Board-Karte
function kVollHTML(f, abt, farbe){
  const L = lage(f);
  const stand = f.kernaussage ? `<div class="kv-zeile"><span>Stand</span><p>${zeile(esc(f.kernaussage))}</p></div>` : "";
  const tun = f.taetigkeit ? `<div class="kv-zeile"><span>Zuletzt</span><p>${esc(f.taetigkeit)}</p></div>` : "";
  const auftrag = f.auftrag ? `<div class="kv-zeile"><span>Auftrag</span><p>${esc(kKurz(f.auftrag, 220))}</p></div>` : "";
  return `<div class="kv">
    <div class="kv-kopf"><span class="kf-av" style="--c:${farbe}">${esc(kIni(abt))}</span><div><small>${esc(abt)}</small><b>${esc(kKurz(f.titel, 70))}</b></div>
      <span class="kv-status ${L.art}">${esc(L.kurz)}</span></div>
    <div class="kv-koerper">${einstiegHTML(f) || (auftrag + stand + tun)}
      ${f.von_dir && !(f.einstieg && f.status === "braucht_dich") ? `<div class="kv-frage">${esc(f.von_dir)}</div>` : ""}</div>
    <div class="kv-fuss"><span>Antwort unten ins Feld, sie geht an diese Aufgabe.</span><button class="glasknopf" data-kganz="${esc(f.id)}">Ganze Karte</button></div>
  </div>`;
}

function kartenBedienung(){
  const box = document.getElementById("kmapbox");
  let zug = null;
  box.addEventListener("pointerdown", e => {
    if (e.target.closest(".k-voll, .k-frage, [data-k], .k-mini")) return;
    zug = { x: e.clientX, y: e.clientY, vx: kView.x, vy: kView.y }; box.classList.add("zieht"); box.setPointerCapture(e.pointerId);
  });
  box.addEventListener("pointermove", e => { if (!zug) return; kView.x = zug.vx + e.clientX - zug.x; kView.y = zug.vy + e.clientY - zug.y; kAnwenden(); });
  const ende = () => { zug = null; box.classList.remove("zieht"); };
  box.addEventListener("pointerup", ende); box.addEventListener("pointercancel", ende);
  box.addEventListener("wheel", e => {
    if (e.target.closest(".k-voll .f-koerper")) return;      // in einer offenen Karte scrollt der Text
    e.preventDefault();
    const b = box.getBoundingClientRect(), mx = e.clientX - b.left, my = e.clientY - b.top;
    const neu = Math.min(2.5, Math.max(.2, kView.s * (e.deltaY < 0 ? 1.12 : 1/1.12)));
    kView.x = mx - (mx - kView.x) * neu / kView.s; kView.y = my - (my - kView.y) * neu / kView.s; kView.s = neu; kAnwenden();
  }, { passive: false });
  document.getElementById("karte").addEventListener("click", e => {
    if (e.target.closest("[data-kfit]")) { kEinpassen(); return; }
    const ganz = e.target.closest("[data-kganz]");
    if (ganz){ zustand.ansicht = lokaleAnsicht = "mehrfenster"; zeichnen(); waehlen(ganz.dataset.kganz); zielSetzen(); return; }
    const zu = e.target.closest("[data-kzu]");
    if (zu){ kOffen.delete(zu.dataset.kzu); if (kartenWahl === zu.dataset.kzu) kartenWahl = null; kartenZeichnen(); zielSetzen(); return; }
    const k = e.target.closest("[data-k]"), w = e.target.closest("[data-ws]");
    if (k){
      const id = k.dataset.k, auf = !kOffen.has(id);
      auf ? kOffen.add(id) : kOffen.delete(id); kartenWahl = id; kartenZeichnen(); zielSetzen();
      // Die geoeffnete Karte in die Mitte holen und lesbar zoomen
      const el = auf && document.querySelector(`#kmapbox .k-voll[data-kid="${CSS.escape(id)}"]`);
      if (el){
        const b = document.getElementById("kmapbox").getBoundingClientRect();
        const hoehe = el.offsetHeight || 520;
        kView.s = Math.max(kView.s, Math.min(1, (b.height - 60) / hoehe));
        const wx = parseFloat(el.style.left) + 260, wy = parseFloat(el.style.top) + hoehe / 2;
        kView.x = b.width / 2 - wx * kView.s; kView.y = b.height / 2 + 20 - wy * kView.s;
        const w = document.querySelector("#kmapbox .k-welt"); w.style.transition = "transform .35s ease"; kAnwenden();
        setTimeout(() => { w.style.transition = ""; }, 400);
      }
      return;
    }
    if (w){ kartenWs = w.dataset.ws; kartenWahl = null; kOffen.clear(); kView.init = false; kartenZeichnen(); zielSetzen(); }
  });
  window.addEventListener("resize", () => { if (zustand.ansicht === "karte") kEinpassen(); });
}

const fensterSection = (f,i) => `<section class="${fensterKlassen(lage(f))}" data-i="${i}">${fensterHTML(f)}</section>`;

/* Mehrfenster: Auswahl durch Marcel hat Vorrang vor Tonys Fokus.
   auswahl = geklickt, angetippt oder mit der Maus kurz angesteuert; sie bleibt stehen, bis die naechste Wahl kommt.
   Ohne Auswahl folgt die Ansicht Tony (Fokus, sonst was dich braucht, sonst was laeuft).
   Tony verdraengt eine Auswahl nie; sein neuer Fokus erscheint nur als Band ueber dem Inhalt. */
let auswahl = null, gezeigt = null, gezeigtHTML = "";
const finde = id => zustand.fenster.find(f=>f.id===id);
function tonysWahl(){
  const F = zustand.fenster;
  return finde(zustand.fokus) || F.find(f=>f.status==="braucht_dich") || F.find(f=>f.status==="arbeitet") || F[0];
}
function gewaehlt(){ return finde(auswahl) || tonysWahl(); }

function leisteZeichnen(){
  const F = zustand.fenster;
  const A = F.map(f=>lage(f).art), zahl = a => A.filter(x=>x===a).length;
  const teile = [
    [zahl("marcel"), "braucht dich", "brauchen dich"],
    [zahl("fehler"), "mit Fehler", "mit Fehler"],
    [zahl("arbeitet"), "arbeitet", "arbeiten"],
    [zahl("wartet")+zahl("extern")+zahl("agent")+zahl("zugang"), "wartet", "warten"],
    [zahl("unbestaetigt"), "ohne bestätigtes Signal", "ohne bestätigtes Signal"],
  ].map(([n,e,m])=>n ? `${n} ${n===1?e:m}` : "").filter(Boolean);
  setzeHTML(document.getElementById("lkopf"), `<b>Sitzungen · ${F.length}</b><span>${teile.join(" · ") || "nichts offen"}</span>`);
  const sortiert = nachPrio(F);
  const sel = gewaehlt()?.id;
  let gruppe = null, html = "";
  for (const f of sortiert){
    const L = lage(f);
    if (L.art !== gruppe){ gruppe = L.art; html += `<div class="gruppe ${L.art}">${esc(L.kurz)}</div>`; }
    // Knapp, aber nie leer: was dich gefragt wird, woran es haengt oder was gerade getan wird
    const unter = L.art === "marcel" ? `<span class="s-stand vondir">${zeile(esc(L.frage))}</span>`
      : L.fehler ? `<span class="s-stand fehler"><b class="art">Fehler:</b> ${esc(L.fehler)}</span>`
      : L.wartet ? `<span class="s-stand"><b class="art">Wartet auf:</b> ${zeile(esc(L.grund || "Grund nicht genannt"))}</span>`
      : L.art === "fertig" && f.kernaussage ? `<span class="s-stand">${zeile(esc(f.kernaussage))}</span>`
      : L.taetigkeit ? `<span class="s-stand">${zeile(esc(L.taetigkeit))}</span>`
      : f.kernaussage ? `<span class="s-stand">${zeile(esc(f.kernaussage))}</span>` : "";
    html += `<button class="sitzung ${L.art} ${f.id===sel?"gewaehlt":""}" data-sid="${esc(f.id)}" aria-current="${f.id===sel}">
      <div class="logo">${LOGOS[f.app]||LOGOS.notiz}</div>
      <div class="s-text"><b title="${esc(f.titel)}">${esc(f.titel)}${f.id===zustand.fokus?'<span class="tony">Tony hier</span>':""}</b>
        <div class="s-zeile"><span class="status ${L.art}"><i></i>${esc(L.kurz)}</span><small class="signal ${L.signalAlt?"alt":""}">${esc(L.signalKurz)}</small></div>
        ${unter}</div></button>`;
  }
  setzeHTML(document.getElementById("lliste"), html);
  setzeHTML(document.getElementById("ltodos"), blickHTML());
  const bf = blickFaellig();
  setzeHTML(document.getElementById("lblick"), `Bleibt im Blick${(zustand.blick||[]).length ? " · " + zustand.blick.length : ""}${bf ? ` · ${bf} fällig` : ""}`);
}

function detailZeichnen(){
  const d = document.getElementById("detail");
  if (!zustand.fenster.length) return;
  const f = gewaehlt(), tony = tonysWahl();
  let band = "";
  if (auswahl && tony && tony.id !== f.id){
    const b = lage(tony).art==="marcel";
    band = `<div class="band ${b?"braucht_dich":""}"><span>${b?"Braucht dich":"Tony ist gerade bei"}: <b>${esc(tony.titel)}</b></span><button class="glasknopf" data-folgen>Dorthin</button></div>`;
  }
  const html = band + fensterSection(f, zustand.fenster.indexOf(f));
  const gleich = gezeigt === f.id;
  if (gleich && html === gezeigtHTML) return;
  const k = d.querySelector(".f-koerper"), top = gleich && k ? k.scrollTop : 0;
  const offen = gleich && !!d.querySelector("details.mehr-text[open]");
  d.innerHTML = html; d._h = null;
  if (!gleich) d.querySelector(".fenster")?.classList.add("neu");
  if (offen) d.querySelector("details.mehr-text")?.setAttribute("open","");
  if (top) d.querySelector(".f-koerper").scrollTop = top;
  gezeigt = f.id; gezeigtHTML = html;
  zielSetzen();
}

/* Die Nachricht im Eingabefeld gehoert zu der Karte, die beim Schreiben vor Marcel stand.
   Sobald er tippt, wird diese Karte festgehalten (zielFest) und nicht mehr gewechselt, auch wenn
   Tony den Fokus weiterdreht oder Marcel weiterblaettert. Beim Absenden geht genau diese id mit. */
let zielFest = null;
function zielJetzt(){
  return zustand.ansicht === "rondell" ? vornFenster() : zustand.ansicht === "mehrfenster" ? gewaehlt()
    : zustand.ansicht === "karte" ? (finde(kartenWahl) || null) : null;
}
function zielKarte(){
  if (zielFest === null) return zielJetzt();
  if (zielFest === "") return null;
  return finde(zielFest) || (zustand.archiv||[]).find(a=>a.id===zielFest) || {id: zielFest, titel: zielFest};
}
function zielSetzen(){
  const f = zielKarte(), feld = document.getElementById("text");
  const angeheftet = zielFest !== null && feld && feld.value.trim();
  const el = document.getElementById("ziel");
  el.textContent = f ? `Zu: ${f.titel}` : "Ohne Karte · an Tony";
  el.classList.toggle("fest", !!angeheftet);
  // Sitzungskarten (cc-…) holen die Nachricht selbst ab: sie geht direkt in die laufende Claude-Sitzung
  if (feld) feld.placeholder = f && String(f.id).startsWith("cc-") ? "Nachricht direkt an diese Sitzung …" : "Nachricht an Tony …";
  el.title = f
    ? (angeheftet ? `Diese Nachricht geht zu „${f.titel}“ - der Karte, die beim Schreiben vorne stand.`
                  : `Deine Nachricht bezieht sich auf „${f.titel}“.`)
    : "Keine Karte vorne: die Nachricht geht allgemein an Tony, ohne Bezug zu einer Karte.";
}

function waehlen(id){
  auswahl = id;
  if (rondellListe().some(f=>f.id===id)) vornId = id;
  leisteZeichnen(); detailZeichnen(); drehen();
}

function drehen(){
  const F = rondellListe(), n = F.length, vorn = vornIndex(F);
  document.getElementById("nav").style.visibility = (zustand.ansicht==="rondell" && n>1) ? "visible" : "hidden";
  document.querySelectorAll("#rondell .fenster").forEach(el=>{
    if (el.dataset.neu) el.style.transition = "none"; // Neues Fenster erscheint an seinem Platz, ohne durchs Bild zu fliegen
    const i = +el.dataset.i;
    let d = i - vorn; if (d > n/2) d -= n; if (d < -n/2) d += n;
    const a = Math.abs(d);
    el.style.transform = `translate(-50%,-50%) translate3d(${d*44}%,0,${-a*22}rem) rotateY(${-d*30}deg)`;
    el.style.opacity = a > 1 ? 0 : 1 - a*0.55;
    el.style.visibility = a > 1 ? "hidden" : "visible";
    el.style.zIndex = 10 - a;
    el.style.pointerEvents = a > 1 ? "none" : "auto";
    el.classList.toggle("vorn", a===0);
  });
  const neue = document.querySelectorAll("#rondell .fenster[data-neu]");
  if (neue.length){ void document.body.offsetWidth; neue.forEach(el=>{ el.style.transition = ""; delete el.dataset.neu; }); }
  document.getElementById("zaehler").textContent = `${String(vorn+1).padStart(2,"0")} / ${String(n).padStart(2,"0")}`;
  zielSetzen();
}

async function laden(){
  try{
    const res = await fetch(API + KEY + "/state", {cache:"no-store"});
    if (!res.ok) throw new Error(res.status);
    const z = await res.json();
    document.getElementById("live").classList.remove("aus");
    document.querySelector("#live span").textContent = "verbunden";
    const stand = JSON.stringify([z.fenster, z.fokus, z.ansicht, z.blick, z.absprache, z.eingang, z.archiv]);
    if (stand === letzterStand) return;
    letzterStand = stand;
    const erstes = letzterFokus === undefined, vorher = zustand.fenster;
    zustand = z;
    zustand.blick = z.blick || [];
    // Ansicht: Tonys Wechsel gilt, sonst bleibt Marcels eigene (Archiv, Absprache) stehen
    if (z.ansicht !== letzteServerAnsicht){ letzteServerAnsicht = z.ansicht; lokaleAnsicht = null; }
    if (lokaleAnsicht) zustand.ansicht = lokaleAnsicht;
    const ruhig = Date.now() - letzteHand > 15000;
    const nachVorn = f => { bereichWahl = bereichVon(f); vornId = f.id; };
    if (erstes){
      bereichWahl = bereichStart(); vornId = rondellListe()[0]?.id ?? null;
    } else {
      // Was neu nach dir fragt, kommt nach vorn; Tonys ausdruecklicher Fokus auch. Beides nur, wenn du gerade nicht selbst blaetterst.
      const neuDich = z.fenster.find(f=>f.status==="braucht_dich" && !vorher.some(v=>v.id===f.id && v.status==="braucht_dich"));
      const fokus = z.fokus !== letzterFokus ? finde(z.fokus) : null;
      if (fokus && (ruhig || fokusFolgen)) nachVorn(fokus);
      else if (neuDich && ruhig) nachVorn(neuDich);
    }
    letzterFokus = z.fokus; fokusFolgen = false;
    zeichnen();
  }catch(e){
    document.getElementById("live").classList.add("aus");
    document.querySelector("#live span").textContent = "keine Verbindung";
  }
}

async function senden(pfad, daten){
  await fetch(API + KEY + "/" + pfad, {method:"POST", headers:{"content-type":"application/json"}, body:JSON.stringify(daten)});
  letzterStand = ""; laden();
}

function schritt(d){ const RF = rondellListe(), n = RF.length; if (!n) return; vornId = RF[(vornIndex(RF) + d + n) % n].id; drehen(); }

function start(){
  for (const ev of ["pointerdown","wheel","keydown","touchstart"]) document.addEventListener(ev, () => letzteHand = Date.now(), {capture:true, passive:true});
  document.getElementById("bereiche").addEventListener("click", e => {
    const b = e.target.closest("[data-bereich]"); if (!b) return;
    bereichWahl = b.dataset.bereich; try { localStorage.setItem("tonyBereich", bereichWahl); } catch(e) {}
    vornId = rondellListe()[0]?.id ?? null; zeichnen();
  });
  // Bleibt im Blick: abhaken, oder zum Fenster springen
  document.addEventListener("click", e => {
    const ab = e.target.closest("[data-blick]");
    if (ab){
      const id = ab.dataset.blick, b = (zustand.blick||[]).find(x=>String(x.id)===id);
      zustand.blick = (zustand.blick||[]).filter(x=>String(x.id)!==id); zeichnen();
      senden("blick-erledigt", {id, text: b?.text}); return;
    }
    const z = e.target.closest("[data-zeige]"), f = z && finde(z.dataset.zeige);
    if (!f) return;
    if (zustand.ansicht === "mehrfenster") { waehlen(f.id); return; }
    zustand.ansicht = lokaleAnsicht = "rondell"; bereichWahl = bereichVon(f); vornId = f.id; zeichnen();
  });
  document.getElementById("zurueck").onclick = () => schritt(-1);
  document.getElementById("vor").onclick = () => schritt(1);
  document.addEventListener("keydown", e => { if (e.target.tagName === "INPUT") return;
    if (zustand.ansicht === "mehrfenster" && (e.key==="ArrowUp" || e.key==="ArrowDown")){
      const ids = [...document.querySelectorAll("#lliste .sitzung")].map(b=>b.dataset.sid);
      const n = ids.indexOf(gewaehlt()?.id) + (e.key==="ArrowDown" ? 1 : -1);
      if (ids[n]){ e.preventDefault(); waehlen(ids[n]); document.querySelector(`#lliste [data-sid="${CSS.escape(ids[n])}"]`)?.focus(); }
      return;
    }
    if (e.key==="ArrowLeft") schritt(-1); if (e.key==="ArrowRight") schritt(1); });
  // Sitzungsleiste: Klick/Antippen waehlt; Maus-Schweben (nur echte Maus) waehlt nach kurzer Ruhe ebenfalls und bleibt stehen
  const liste = document.getElementById("lliste");
  // Nur echte Bewegung zaehlt: Neuzeichnen unter einer ruhenden Maus loest sonst Hover-Ereignisse aus
  let schwebe = null, mx = -1, my = -1;
  liste.addEventListener("click", e => { const b = e.target.closest("[data-sid]"); if (b) waehlen(b.dataset.sid); });
  liste.addEventListener("pointermove", e => {
    if (e.pointerType !== "mouse" || (e.clientX === mx && e.clientY === my)) return;
    mx = e.clientX; my = e.clientY;
    const b = e.target.closest("[data-sid]");
    clearTimeout(schwebe);
    if (!b || b.dataset.sid === gewaehlt()?.id) return;
    schwebe = setTimeout(() => waehlen(b.dataset.sid), 250);
  });
  liste.addEventListener("pointerleave", () => clearTimeout(schwebe));
  // Rad/Trackpad: eine Geste = genau ein Fenster weiter. Gesperrt, bis 300 ms lang keine Radbewegung mehr kam
  // (Trackpad-Nachlauf feuert sonst Dutzende Ereignisse). Ueber dem Inhalt des vorderen Fensters wird normal gescrollt.
  let summe = 0, gesperrt = false, ruhe = null;
  document.getElementById("rondell").addEventListener("wheel", e => {
    if (e.target.closest(".fenster.vorn .f-koerper")) return;
    e.preventDefault();
    clearTimeout(ruhe); ruhe = setTimeout(() => { gesperrt = false; summe = 0; }, 300);
    if (gesperrt) return;
    summe += Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
    if (Math.abs(summe) < 60) return;
    schritt(summe > 0 ? 1 : -1); gesperrt = true; summe = 0;
  }, {passive:false});
  let tx = null;
  document.getElementById("rondell").addEventListener("touchstart", e => tx = e.touches[0].clientX, {passive:true});
  document.getElementById("rondell").addEventListener("touchend", e => { if (tx===null) return; const d = e.changedTouches[0].clientX - tx; if (Math.abs(d) > 60) schritt(d < 0 ? 1 : -1); tx = null; });
  document.querySelector(".buehne").addEventListener("click", e => {
    const ar = e.target.closest("[data-archiv]"), zu = e.target.closest("[data-zurueck]");
    if (ar) { zustand.fenster = zustand.fenster.filter(f=>f.id!==ar.dataset.archiv); zeichnen(); senden("archivieren", {id: ar.dataset.archiv}); return; }
    if (zu) { zustand.ansicht = lokaleAnsicht = "rondell"; fokusFolgen = true; senden("archivieren", {id: zu.dataset.zurueck, zurueck:true}); return; }
    const ja = e.target.closest("[data-ja]"), ab = e.target.closest("[data-ab]");
    if (ja) { senden("eingabe", {fenster_id: ja.dataset.ja, art:"freigabe", text:"Freigegeben"}); return; }
    if (ab) {
      const w = prompt("Was soll Tony ändern?");
      if (w !== null) senden("eingabe", {fenster_id: ab.dataset.ab, art:"ablehnung", text: w || "Bitte überarbeiten"});
      return;
    }
    if (e.target.closest("[data-folgen]")) { auswahl = null; leisteZeichnen(); detailZeichnen(); return; }
    const f = e.target.closest("#rondell .fenster:not(.vorn)");
    if (f) { vornId = f.dataset.id; drehen(); }
  });
  kartenBedienung();
  document.getElementById("umschalter").addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    zustand.ansicht = lokaleAnsicht = b.dataset.a; zeichnen(); zielSetzen();
    if (b.dataset.a === "rondell" || b.dataset.a === "mehrfenster") senden("ansicht", {ansicht: b.dataset.a});
  });
  document.getElementById("text").addEventListener("input", e => {
    // Erstes Zeichen heftet die Karte fest, leeres Feld gibt sie wieder frei
    if (e.target.value.trim()) { if (zielFest === null) zielFest = zielJetzt()?.id ?? ""; }
    else zielFest = null;
    zielSetzen();
  });
  document.getElementById("eingabe").addEventListener("submit", e => {
    e.preventDefault();
    const t = document.getElementById("text"); const text = t.value.trim(); if (!text) return;
    const f = zielKarte();
    senden("eingabe", {fenster_id: f?.id ?? null, art:"nachricht", text});
    t.value = ""; zielFest = null; zielSetzen();
    t.placeholder = f ? `Gesendet zu „${f.titel}“. Tony liest es beim nächsten Blick aufs Board.`
                      : "Ohne Karte gesendet. Tony liest es beim nächsten Blick aufs Board.";
  });
  document.getElementById("asuche").addEventListener("input", archivZeichnen);
  laden(); setInterval(laden, 1500); setInterval(zeichnen, 20000);
}

if (KEY) start();
else {
  document.body.insertAdjacentHTML("beforeend", `<div class="schluessel"><form id="sf"><b>Tony Board</b><input id="sk" placeholder="Zugangsschlüssel"><button class="glasknopf">Öffnen</button></form></div>`);
  document.getElementById("sf").onsubmit = e => { e.preventDefault(); location.hash = "k=" + document.getElementById("sk").value.trim(); location.reload(); };
}
</script>
